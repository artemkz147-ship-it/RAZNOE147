plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dinomosaic.kids'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dinomosaic.kids'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.0.5'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
