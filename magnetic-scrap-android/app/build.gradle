plugins { id 'com.android.application' }

android {
    namespace 'com.artem.magneticscrap'
    compileSdk 35

    defaultConfig {
        applicationId 'com.artem.magneticscrap.rebuild'
        minSdk 26
        targetSdk 35
        versionCode 40
        versionName '4.0.0-rebuild'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}
