<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#050506" />
  <title>UMK3 HD Fan Remake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" width="1280" height="720" aria-label="UMK3 HD Fan Remake"></canvas>
    <div id="touch-ui" aria-hidden="true">
      <div class="dpad">
        <button data-key="left" class="touch left">◀</button>
        <button data-key="up" class="touch up">▲</button>
        <button data-key="right" class="touch right">▶</button>
        <button data-key="down" class="touch down">▼</button>
      </div>
      <div class="run-zone">
        <button data-key="RUN" class="touch run">RUN</button>
        <button data-key="BL" class="touch block">BL</button>
      </div>
      <div class="actions">
        <button data-key="HP" class="touch hp">HP</button>
        <button data-key="LP" class="touch lp">LP</button>
        <button data-key="HK" class="touch hk">HK</button>
        <button data-key="LK" class="touch lk">LK</button>
        <button data-key="SPECIAL" class="touch special">SP</button>
      </div>
    </div>
    <button id="pause" aria-label="Пауза">Ⅱ</button>
  </main>
  <script src="umk3-data.js"></script>
  <script src="hd-atlases.js"></script>
  <script src="game.js"></script>
  <script src="hd-renderer.js"></script>
</body>
</html>
