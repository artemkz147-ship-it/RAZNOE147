<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#050506" />
  <title>UMK3 HD Fan Remake</title>
  <link rel="stylesheet" href="style.css" />
  <script src="boot-guard.js"></script>
</head>
<body>
  <main id="app">
    <canvas id="game" width="1280" height="720" aria-label="UMK3 HD Fan Remake"></canvas>

    <div id="touch-ui" aria-hidden="true">
      <div id="move-pad" aria-label="Движение">
        <span class="pad-ring"></span><span class="pad-cross"></span><span id="move-knob"></span>
      </div>

      <div class="run-zone">
        <button data-key="RUN" class="touch run">RUN</button>
        <button data-key="BL" class="touch block">BLOCK</button>
      </div>

      <div class="actions">
        <button data-key="HP" class="touch hp"><b>HP</b><small>HIGH PUNCH</small></button>
        <button data-key="LP" class="touch lp"><b>LP</b><small>LOW PUNCH</small></button>
        <button data-key="HK" class="touch hk"><b>HK</b><small>HIGH KICK</small></button>
        <button data-key="LK" class="touch lk"><b>LK</b><small>LOW KICK</small></button>
      </div>
    </div>

    <button id="pause" aria-label="Пауза">Ⅱ</button>
    <button id="controls-gear" aria-label="Настройки управления" hidden>⚙</button>
    <section id="controls-panel" aria-label="Настройки управления">
      <header>УПРАВЛЕНИЕ</header>
      <label>Общий размер <input id="control-size" type="range" min="0.72" max="1.28" step="0.02" /></label>
      <label>Размер кнопок <input id="button-size" type="range" min="0.78" max="1.24" step="0.02" /></label>
      <label>Прозрачность <input id="control-opacity" type="range" min="0.38" max="1" step="0.02" /></label>
      <button id="controls-reset">СБРОСИТЬ</button>
      <p>Левый стик поддерживает диагонали. Кнопки работают одновременно несколькими пальцами.</p>
    </section>
  </main>

  <script src="umk3-data.js"></script>
  <script src="version.js"></script>
  <script src="hd-atlases.js"></script>
  <script src="game.js"></script>
  <script src="hd-renderer.js"></script>
  <script src="raster-runtime.js"></script>
  <script src="mobile-controls.js"></script>
</body>
</html>
