plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.forma365.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.forma365.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
