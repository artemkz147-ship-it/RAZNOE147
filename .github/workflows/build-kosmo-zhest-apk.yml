name: Build Kosmo Zhest APK

on:
  push:
    branches:
      - build/kosmo-zhest-apk-20260907
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild embedded game HTML
        shell: bash
        run: |
          set -euo pipefail
          cat kosmo-zhest-apk/app/src/main/assets/game.html.gz.b64.part* \
            | base64 -d \
            | gzip -d > kosmo-zhest-apk/app/src/main/assets/index.html
          echo "44178ec067abce09f11c7587c7ed1ad7cacf9a78f92f3699372934eb39fc185f  kosmo-zhest-apk/app/src/main/assets/index.html" | sha256sum -c -

      - name: Build installable debug APK
        working-directory: kosmo-zhest-apk
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp kosmo-zhest-apk/app/build/outputs/apk/debug/app-debug.apk kosmo-zhest-ar-v2.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test app launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r kosmo-zhest-ar-v2.apk
            adb shell pm grant com.artem.kosmozhest android.permission.CAMERA || true
            adb logcat -c
            adb shell am start -W -n com.artem.kosmozhest/.MainActivity
            sleep 12
            adb logcat -d -t 2500 > smoke-log.txt
            adb shell pidof com.artem.kosmozhest
            grep -E "FATAL EXCEPTION|AndroidRuntime: FATAL|Process: com\.artem\.kosmozhest|crash|WebView" smoke-log.txt > smoke-important.txt || true
            cat smoke-important.txt || true
            ! grep -E "FATAL EXCEPTION|AndroidRuntime: FATAL|Process: com\.artem\.kosmozhest" smoke-log.txt

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosmo-zhest-smoke-log
          path: |
            smoke-log.txt
            smoke-important.txt
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kosmo-zhest-ar-apk-v2
          path: kosmo-zhest-ar-v2.apk
          if-no-files-found: error
