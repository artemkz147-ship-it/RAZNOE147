name: Build Читай Всё Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chitai-vse-release.yml'
      - 'inkflow_patch_120/ic_launcher_release.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        run: |
          cat inkflow_build_parts/part00 inkflow_build_parts/part01 inkflow_build_parts/part02 inkflow_build_parts/part03 inkflow_build_parts/part04 | base64 --decode > InkFlowBuild.zip
          unzip -tq InkFlowBuild.zip
          unzip -q -o InkFlowBuild.zip

      - name: Add book reader and branding
        run: |
          TARGET=InkFlowReader/app/src/main/java/app/inkflow/reader
          cp inkflow_patch_120/BookContent.java "$TARGET/BookContent.java"
          cp inkflow_patch_120/BookProgressStore.java "$TARGET/BookProgressStore.java"
          cat inkflow_patch_120/BookSourceFactory.java.part00 inkflow_patch_120/BookSourceFactory.java.part01 inkflow_patch_120/BookSourceFactory.java.part02 > "$TARGET/BookSourceFactory.java"
          cat inkflow_patch_120/BookReaderActivity.java.part00 inkflow_patch_120/BookReaderActivity.java.part01 inkflow_patch_120/BookReaderActivity.java.part02 > "$TARGET/BookReaderActivity.java"
          python3 inkflow_patch_120/apply_120.py
          rm -f InkFlowReader/app/src/main/res/drawable/ic_launcher.png
          cp inkflow_patch_120/ic_launcher_release.xml InkFlowReader/app/src/main/res/drawable/ic_launcher.xml
          grep -q 'versionName .1.2.0.' InkFlowReader/app/build.gradle
          grep -q 'Читай Всё' InkFlowReader/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned release APK
        run: gradle --no-daemon -p InkFlowReader assembleRelease --stacktrace

      - name: Collect release tools
        run: |
          cp InkFlowReader/app/build/outputs/apk/release/app-release-unsigned.apk Chitai-Vse-1.2.0-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: Chitai-Vse-Release-Unsigned-1.2.0
          path: |
            Chitai-Vse-1.2.0-release-unsigned.apk
            apksigner.jar
          if-no-files-found: error
