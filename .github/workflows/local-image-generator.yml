name: Build Local Image Generator APK

on:
  push:
    branches:
      - local-image-generator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download Local Diffusion APK
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -o OfflineImageGenerator.apk \
            https://github.com/rmatif/Local-Diffusion/releases/download/v0.3/local_diffusion_v0.3.apk
          test -s OfflineImageGenerator.apk
          file OfflineImageGenerator.apk
          sha256sum OfflineImageGenerator.apk | tee OfflineImageGenerator.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineImageGenerator-APK
          path: |
            OfflineImageGenerator.apk
            OfflineImageGenerator.apk.sha256
          if-no-files-found: error
          compression-level: 0
