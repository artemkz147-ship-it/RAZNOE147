name: Publish StoryBook AI Web

on:
  push:
    branches: [ "storybook-ai-v1" ]
    paths:
      - "storybook-ai/app/src/main/assets/**"
      - ".github/workflows/publish-storybook-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storybook-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore web app
        run: |
          mkdir -p _site
          cat storybook-ai/app/src/main/assets/index.html.gz.part* > /tmp/index.html.gz
          gzip -t /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
