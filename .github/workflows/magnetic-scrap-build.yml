name: Magnetic Scrap Android Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'magnetic-scrap-android/**'
      - '.github/workflows/magnetic-scrap-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        working-directory: magnetic-scrap-android
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        run: |
          APK=magnetic-scrap-android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagneticScrap-v3.0-fixed
          path: magnetic-scrap-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
