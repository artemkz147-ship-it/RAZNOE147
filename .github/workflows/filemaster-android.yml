name: FileMaster Android

on:
  push:
    branches: [ filemaster-offline ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Bundle OCR languages into APK
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fL --retry 3 -o app/src/main/assets/tessdata/rus.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata
          curl -fL --retry 3 -o app/src/main/assets/tessdata/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata
          test -s app/src/main/assets/tessdata/rus.traineddata
          test -s app/src/main/assets/tessdata/eng.traineddata

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -q '^assets/tessdata/rus.traineddata$'
          unzip -Z1 "$APK" | grep -q '^assets/tessdata/eng.traineddata$'
          DEX_COUNT=$(unzip -Z1 "$APK" | grep -Ec '^classes([0-9]+)?\.dex$')
          test "$DEX_COUNT" -ge 1
          echo "Verified APK with $DEX_COUNT dex file(s)"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FileMaster-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FileMaster-offline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
