name: FileMaster Android

on:
  push:
    branches: [ filemaster-offline ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Bundle OCR languages into APK
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fL --retry 3 -o app/src/main/assets/tessdata/rus.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata
          curl -fL --retry 3 -o app/src/main/assets/tessdata/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata
          test -s app/src/main/assets/tessdata/rus.traineddata
          test -s app/src/main/assets/tessdata/eng.traineddata

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint release
        run: gradle :app:lintRelease --stacktrace

      - name: Build unsigned release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Align unsigned release APK for 16 KB pages
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -x "$BT/zipalign" ]; then BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"; fi
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Doki-1.2.0-release-aligned-unsigned.apk
          "$BT/zipalign" -c -P 16 4 app/build/outputs/apk/release/Doki-1.2.0-release-aligned-unsigned.apk
          test -s "$BT/lib/apksigner.jar"
          cp "$BT/lib/apksigner.jar" app/build/outputs/apksigner-36.jar

      - name: Verify release package
        run: |
          APK=app/build/outputs/apk/release/Doki-1.2.0-release-aligned-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          unzip -Z1 "$APK" | grep -q '^assets/tessdata/rus.traineddata$'
          unzip -Z1 "$APK" | grep -q '^assets/tessdata/eng.traineddata$'
          DEX_COUNT=$(unzip -Z1 "$APK" | grep -Ec '^classes([0-9]+)?\.dex$')
          test "$DEX_COUNT" -ge 1
          echo "Verified 16 KB aligned unsigned release APK with $DEX_COUNT dex file(s)"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Doki-release-lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Upload unsigned aligned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Doki-1.2.0-release-unsigned-apk
          path: app/build/outputs/apk/release/Doki-1.2.0-release-aligned-unsigned.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Doki-1.2.0-release-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Android apksigner
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-36
          path: app/build/outputs/apksigner-36.jar
          if-no-files-found: error
