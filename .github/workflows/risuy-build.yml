name: Build Risuy i Kati fixed APK

on:
  push:
    branches:
      - chatgpt-risuy-fix
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore and verify game asset
        working-directory: chatgpt_build/risuy
        run: |
          mkdir -p app/src/main/assets
          cat app/src/main/assets/chunk_*.b64 | base64 -d | gzip -d > app/src/main/assets/index.html
          echo "b7343e57215c3d3e913e6882e2d198f3c2bc1eaafdbfda4ab8cd82339f4bd265  app/src/main/assets/index.html" | sha256sum -c -

      - name: Build APK with official Android Gradle Plugin
        working-directory: chatgpt_build/risuy
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect APK
        run: cp chatgpt_build/risuy/app/build/outputs/apk/debug/app-debug.apk risuy-i-kati-fixed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: risuy-i-kati-fixed
          path: risuy-i-kati-fixed.apk
          if-no-files-found: error
          retention-days: 7
