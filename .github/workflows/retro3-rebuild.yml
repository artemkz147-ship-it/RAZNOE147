name: Retro 3 in 1 rebuild
on:
  push:
    branches: [retro-3in1-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Retro 3 startup hotfix
        run: python3 tools/retro3_v261_hotfix.py
      - name: Apply Retro 3 v2.7 patch
        run: python3 tools/retro3_v270.py
      - name: Apply Retro 3 v2.7.1 input/layout fix
        run: python3 tools/retro3_v271.py
      - name: Apply Retro 3 v2.7.2 raw ROM picker fix
        run: python3 tools/retro3_v272.py
      - name: Apply Retro 3 v2.7.3 payload fix
        run: python3 tools/retro3_v273.py
      - name: Apply Retro 3 v2.7.4 NES input/cutout fix
        run: python3 tools/retro3_v274.py
      - name: Apply Retro 3 v2.7.5 NES dpad geometry fix
        run: python3 tools/retro3_v275.py
      - name: Apply Retro 3 v2.7.6 NES input arbitration fix
        run: python3 tools/retro3_v276.py
      - name: Apply Retro 3 v2.7.7 persistent save states
        run: python3 tools/retro3_v277.py
      - name: Apply Retro 3 v2.7.8 NES menu input fix
        run: python3 tools/retro3_v278.py
      - name: Apply Retro 3 v2.7.9 focus frame and physical Start fix
        run: python3 tools/retro3_v279.py
      - name: Apply Retro 3 v2.8.0 native focus and mapper fix
        run: python3 tools/retro3_v280.py
      - name: Apply Retro 3 v2.8.1 PS1 native system buttons and layout fix
        run: python3 tools/retro3_v281.py
      - name: Apply Retro 3 v2.8.2 standard gamepad auto mapping
        run: python3 tools/retro3_v282.py
      - name: Apply Retro 3 v2.8.3 persistent BIOS, ads, Premium and raw gamepad buttons
        run: python3 tools/retro3_v283.py
      - name: Apply Retro 3 v2.8.4 PS1 virtual touch repair
        run: python3 tools/retro3_v284.py
      - name: Apply Retro 3 v2.8.5 PS1 proven control geometry
        run: python3 tools/retro3_v285.py
      - name: Fetch complete offline EmulatorJS payload
        run: |
          set -euo pipefail
          BASE=https://cdn.emulatorjs.org/4.2.3/data
          mkdir -p app/src/main/assets/data/cores app/src/main/assets/data/compression app/src/main/assets/data/localization
          fetch() { curl -fL --retry 3 --retry-delay 2 "$BASE/$1" -o "app/src/main/assets/data/$1"; }
          fetch loader.js
          fetch emulator.min.js
          fetch emulator.min.css
          fetch version.json
          fetch cores/cores.json
          fetch localization/retroarch.json
          fetch localization/ru-RU.json
          fetch compression/extract7z.js
          fetch compression/extractzip.js
          fetch compression/libunrar.js
          fetch compression/libunrar.wasm
          fetch cores/fceumm-wasm.data
          fetch cores/fceumm-legacy-wasm.data
          fetch cores/nestopia-wasm.data
          fetch cores/nestopia-legacy-wasm.data
          fetch cores/genesis_plus_gx-wasm.data
          fetch cores/genesis_plus_gx-legacy-wasm.data
          fetch cores/pcsx_rearmed-wasm.data
          fetch cores/pcsx_rearmed-legacy-wasm.data
      - name: Validate complete emulator payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
            'loader.js','emulator.min.js','emulator.min.css','version.json','cores/cores.json',
            'localization/retroarch.json','localization/ru-RU.json',
            'compression/extract7z.js','compression/extractzip.js','compression/libunrar.js','compression/libunrar.wasm',
            'cores/fceumm-wasm.data','cores/fceumm-legacy-wasm.data',
            'cores/nestopia-wasm.data','cores/nestopia-legacy-wasm.data',
            'cores/genesis_plus_gx-wasm.data','cores/genesis_plus_gx-legacy-wasm.data',
            'cores/pcsx_rearmed-wasm.data','cores/pcsx_rearmed-legacy-wasm.data',
          ]
          base = Path('app/src/main/assets/data')
          missing = [p for p in required if not (base/p).is_file() or (base/p).stat().st_size == 0]
          if missing:
              raise SystemExit('Missing EmulatorJS assets: ' + ', '.join(missing))
          total = sum((base/p).stat().st_size for p in required)
          print('Offline EmulatorJS payload OK:', len(required), 'files,', total, 'bytes')
          if total < 9_000_000:
              raise SystemExit(f'Payload unexpectedly small: {total} bytes')
          PY
      - name: Validate launcher JavaScript
        run: node --check app/src/main/assets/launcher.js
      - name: Validate emulator inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('app/src/main/assets/game.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', src, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found in game.html')
          Path('/tmp/retro-game-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/retro-game-inline.js
      - name: Validate save-state, BIOS, monetization and controller wiring
        run: |
          grep -q "retro3-save-states" app/src/main/assets/game.html
          grep -q "stateKey:opts.libraryId||gameId(selected.core,file)" app/src/main/assets/launcher.js
          grep -q "NES_MIN_PRESS_MS=55" app/src/main/assets/game.html
          grep -q "nesSystemPulse" app/src/main/assets/game.html
          grep -q "setDefaultFocusHighlightEnabled(false)" app/src/main/java/ru/retro/threeinone/MainActivity.java
          grep -q "ANDROID_SCAN_" app/src/main/assets/launcher.js
          grep -q "isNativeGamepadKey" app/src/main/java/ru/retro/threeinone/MainActivity.java
          grep -q "retro-ps1-touch-layout-v285" app/src/main/assets/game.html
          grep -q "top:'0%',joystickInput:false,inputValues:\[4,5,6,7\]" app/src/main/assets/game.html
          grep -q "top:'100%',color:'#e8edf5',joystickInput:true,inputValues:\[16,17,18,19\]" app/src/main/assets/game.html
          ! grep -q "applyPsFactoryLayout" app/src/main/assets/game.html
          grep -q "BIOS_STORE='bios'" app/src/main/assets/launcher.js
          grep -q "3v1prem147" app/src/main/java/ru/retro/threeinone/MainActivity.java
          grep -q "R-M-19800317-1" app/src/main/java/ru/retro/threeinone/MainActivity.java
          grep -q "RuStorePayClient" app/src/main/java/ru/retro/threeinone/MainActivity.java
          grep -q "InterstitialAdLoader" app/src/main/java/ru/retro/threeinone/MainActivity.java
          grep -q "versionName '2.8.5'" app/build.gradle
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: retro3-base-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-sign-tools
          path: |
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/apksigner
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/zipalign
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib64/libc++.so
