name: Retro 3 in 1 rebuild
on:
  push:
    branches: [retro-3in1-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Retro 3 startup hotfix
        run: python3 tools/retro3_v261_hotfix.py
      - name: Apply Retro 3 v2.7 patch
        run: python3 tools/retro3_v270.py
      - name: Apply Retro 3 v2.7.1 input/layout fix
        run: python3 tools/retro3_v271.py
      - name: Fetch secondary NES core
        run: |
          mkdir -p app/src/main/assets/data/cores
          curl -fL --retry 3 --retry-delay 2 https://cdn.emulatorjs.org/4.2.3/data/cores/nestopia-wasm.data -o app/src/main/assets/data/cores/nestopia-wasm.data
          curl -fL --retry 3 --retry-delay 2 https://cdn.emulatorjs.org/4.2.3/data/cores/nestopia-legacy-wasm.data -o app/src/main/assets/data/cores/nestopia-legacy-wasm.data
      - name: Validate launcher JavaScript
        run: node --check app/src/main/assets/launcher.js
      - name: Validate emulator inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('app/src/main/assets/game.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', src, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found in game.html')
          Path('/tmp/retro-game-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/retro-game-inline.js
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: retro3-base-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-sign-tools
          path: |
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/apksigner
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/zipalign
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib64/libc++.so
