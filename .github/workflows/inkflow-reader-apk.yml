name: Build InkFlow Reader APK

on:
  push:
    branches: [main]
    paths:
      - 'InkFlowReader-source.zip'
      - '.github/workflows/inkflow-reader-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q -o InkFlowReader-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable debug APK
        run: gradle --no-daemon -p InkFlowReader assembleDebug

      - name: Rename APK
        run: cp InkFlowReader/app/build/outputs/apk/debug/app-debug.apk InkFlowReader-1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InkFlowReader-APK
          path: InkFlowReader-1.0.0.apk
          if-no-files-found: error
