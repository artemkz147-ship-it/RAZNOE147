name: Build InkFlow Reader APK

on:
  push:
    branches: [main]
    paths:
      - 'inkflow_build_parts/**'
      - '.github/workflows/inkflow-reader-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        run: |
          cat inkflow_build_parts/part00 inkflow_build_parts/part01 inkflow_build_parts/part02 inkflow_build_parts/part03 inkflow_build_parts/part04 | base64 --decode > InkFlowBuild.zip
          unzip -tq InkFlowBuild.zip
          unzip -q -o InkFlowBuild.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable APK
        run: gradle --no-daemon -p InkFlowReader assembleDebug --stacktrace

      - name: Rename APK
        run: cp InkFlowReader/app/build/outputs/apk/debug/app-debug.apk InkFlowReader-1.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InkFlowReader-APK-1.1.1
          path: InkFlowReader-1.1.1.apk
          if-no-files-found: error
