name: Build Читай Всё Release

on:
  push:
    branches: [main]
    paths:
      - 'inkflow_build_parts/**'
      - 'inkflow_patch_120/**'
      - '.github/workflows/inkflow-reader-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        run: |
          cat inkflow_build_parts/part00 inkflow_build_parts/part01 inkflow_build_parts/part02 inkflow_build_parts/part03 inkflow_build_parts/part04 | base64 --decode > InkFlowBuild.zip
          unzip -tq InkFlowBuild.zip
          unzip -q -o InkFlowBuild.zip

      - name: Add book reader and branding
        run: |
          TARGET=InkFlowReader/app/src/main/java/app/inkflow/reader
          cp inkflow_patch_120/BookContent.java "$TARGET/BookContent.java"
          cp inkflow_patch_120/BookProgressStore.java "$TARGET/BookProgressStore.java"
          cat inkflow_patch_120/BookSourceFactory.java.part00 inkflow_patch_120/BookSourceFactory.java.part01 inkflow_patch_120/BookSourceFactory.java.part02 > "$TARGET/BookSourceFactory.java"
          cat inkflow_patch_120/BookReaderActivity.java.part00 inkflow_patch_120/BookReaderActivity.java.part01 inkflow_patch_120/BookReaderActivity.java.part02 > "$TARGET/BookReaderActivity.java"
          python3 inkflow_patch_120/apply_120.py
          rm -f InkFlowReader/app/src/main/res/drawable/ic_launcher.png
          cat > InkFlowReader/app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#090D17" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#151B2B" android:pathData="M8,8h92v92h-92z"/>
              <path android:fillColor="#8A63FF" android:pathData="M54,24C43,17 30,17 20,21v55c10,-4 23,-4 34,4z"/>
              <path android:fillColor="#B49AFF" android:pathData="M54,29C44,23 33,22 25,25v43c9,-2 20,0 29,6z"/>
              <path android:fillColor="#F3C75F" android:pathData="M54,24C65,17 78,17 88,21v55c-10,-4 -23,-4 -34,4z"/>
              <path android:fillColor="#FFE29A" android:pathData="M54,29C64,23 75,22 83,25v43c-9,-2 -20,0 -29,6z"/>
              <path android:fillColor="#FFFFFF" android:fillAlpha="0.82" android:pathData="M31,35h15v3h-15zM31,43h17v3h-17zM31,51h13v3h-13z"/>
              <path android:fillColor="#5B3ED7" android:pathData="M62,36h14a6,6 0,0 1,6 6v9a6,6 0,0 1,-6 6h-6l-6,7 1,-7h-3a6,6 0,0 1,-6 -6v-9a6,6 0,0 1,6 -6z"/>
              <path android:fillColor="#FFF2C8" android:pathData="M63,43h12v3h-12zM63,49h9v3h-9z"/>
              <path android:fillColor="#FFB64D" android:pathData="M49,78h10v8h-10z"/>
          </vector>
          XML
          test -s InkFlowReader/app/src/main/res/drawable/ic_launcher.xml
          grep -q 'versionName .1.2.0.' InkFlowReader/app/build.gradle
          grep -q 'Читай Всё' InkFlowReader/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned release APK
        run: gradle --no-daemon -p InkFlowReader assembleRelease --stacktrace

      - name: Prepare signing package
        run: |
          APK=$(find InkFlowReader/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" Chitai-Vse-1.2.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" ./zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ./apksigner.jar
          chmod +x ./zipalign

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: Chitai-Vse-Release-Unsigned-1.2.0
          path: |
            Chitai-Vse-1.2.0-unsigned.apk
            zipalign
            apksigner.jar
          if-no-files-found: error
