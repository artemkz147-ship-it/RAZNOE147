name: Build Читай Всё Release

on:
  push:
    branches: [main]
    paths:
      - 'inkflow_build_parts/**'
      - 'inkflow_patch_120/**'
      - 'inkflow_patch_130/**'
      - 'inkflow_patch_140/**'
      - 'inkflow_patch_150/**'
      - 'inkflow_patch_151/**'
      - 'inkflow_patch_152/**'
      - 'inkflow_patch_153/**'
      - 'inkflow_patch_160/**'
      - 'inkflow_patch_161/**'
      - 'inkflow_patch_162/**'
      - 'inkflow_patch_163/**'
      - 'inkflow_patch_164/**'
      - 'inkflow_patch_165/**'
      - 'inkflow_patch_166/**'
      - '.github/workflows/inkflow-reader-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        run: |
          cat inkflow_build_parts/part00 inkflow_build_parts/part01 inkflow_build_parts/part02 inkflow_build_parts/part03 inkflow_build_parts/part04 | base64 --decode > InkFlowBuild.zip
          unzip -tq InkFlowBuild.zip
          unzip -q -o InkFlowBuild.zip

      - name: Add reader, artwork and safe-layout fixes
        run: |
          TARGET=InkFlowReader/app/src/main/java/app/inkflow/reader
          RES=InkFlowReader/app/src/main/res/drawable
          cp inkflow_patch_120/BookContent.java "$TARGET/BookContent.java"
          cat inkflow_patch_120/BookSourceFactory.java.part00 inkflow_patch_120/BookSourceFactory.java.part01 inkflow_patch_120/BookSourceFactory.java.part02 > "$TARGET/BookSourceFactory.java"
          cp inkflow_patch_130/BookProgressStore.java "$TARGET/BookProgressStore.java"
          cat inkflow_patch_130/BookReaderActivity.java.part00 inkflow_patch_130/BookReaderActivity.java.part01 inkflow_patch_130/BookReaderActivity.java.part02 inkflow_patch_130/BookReaderActivity.java.part03 > "$TARGET/BookReaderActivity.java"
          cp inkflow_patch_130/BookSettingsActivity.java "$TARGET/BookSettingsActivity.java"
          cp inkflow_patch_140/TorrentService.java "$TARGET/TorrentService.java"
          cp inkflow_patch_140/TorrentActivity.java "$TARGET/TorrentActivity.java"
          cp inkflow_patch_150/BannerAdSlot.java "$TARGET/BannerAdSlot.java"
          python3 inkflow_patch_120/apply_120.py
          python3 inkflow_patch_130/apply_130.py
          python3 inkflow_patch_140/apply_140.py
          python3 inkflow_patch_140/fix_book_pagination.py
          python3 inkflow_patch_150/apply_150.py
          cp inkflow_patch_151/OpenFileActivity.java "$TARGET/OpenFileActivity.java"
          python3 inkflow_patch_151/apply_151.py
          python3 inkflow_patch_152/apply_152.py
          cp inkflow_patch_153/DocumentSourceFactory.fixed.java "$TARGET/DocumentSourceFactory.java"
          python3 inkflow_patch_153/apply_153.py

          cp inkflow_patch_160/AppTheme.java "$TARGET/AppTheme.java"
          cp inkflow_patch_160/Ui.java "$TARGET/Ui.java"
          cp inkflow_patch_160/CoverPlaceholderView.java "$TARGET/CoverPlaceholderView.java"
          cp inkflow_patch_160/LibraryStore.java "$TARGET/LibraryStore.java"
          cp inkflow_patch_160/MainActivity.java "$TARGET/MainActivity.java"
          cp inkflow_patch_160/LibraryActivity.java "$TARGET/LibraryActivity.java"
          cp inkflow_patch_160/BookSettingsActivity.java "$TARGET/BookSettingsActivity.java"
          cp inkflow_patch_160/BannerAdSlot.java "$TARGET/BannerAdSlot.java"
          python3 inkflow_patch_160/apply_160.py

          cp inkflow_patch_161/AppTheme.java "$TARGET/AppTheme.java"
          cp inkflow_patch_161/BannerAdSlot.java "$TARGET/BannerAdSlot.java"
          python3 inkflow_patch_161/apply_161.py

          cp inkflow_patch_162/BannerAdSlot.java "$TARGET/BannerAdSlot.java"
          python3 inkflow_patch_162/apply_162.py
          python3 inkflow_patch_163/apply_163.py

          cp inkflow_patch_164/BannerAdSlot.java "$TARGET/BannerAdSlot.java"
          python3 inkflow_patch_164/apply_164.py

          cp inkflow_patch_165/BannerAdSlot.java "$TARGET/BannerAdSlot.java"
          python3 inkflow_patch_165/apply_165.py

          # 1.6.6: illustrated fallback covers + full-screen reader settings.
          cp inkflow_patch_166/CoverPlaceholderView.java "$TARGET/CoverPlaceholderView.java"
          cp inkflow_patch_166/cover_placeholder_book.xml "$RES/cover_placeholder_book.xml"
          cp inkflow_patch_166/cover_placeholder_comic.xml "$RES/cover_placeholder_comic.xml"
          cp inkflow_patch_166/cover_placeholder_document.xml "$RES/cover_placeholder_document.xml"
          cp inkflow_patch_166/cover_placeholder_archive.xml "$RES/cover_placeholder_archive.xml"
          python3 inkflow_patch_166/apply_166.py

          rm -f "$RES/ic_launcher.xml" "$RES/ic_launcher.png"
          cat inkflow_patch_140/icon64.part00 inkflow_patch_140/icon64.part01 inkflow_patch_140/icon64.part02 inkflow_patch_140/icon64.part03 | base64 --decode > "$RES/ic_launcher.png"
          cat inkflow_patch_150/ad_loading.part00 inkflow_patch_150/ad_loading.part01 inkflow_patch_150/ad_loading.part02 | base64 --decode > "$RES/ad_loading.webp"

          test -s "$RES/ic_launcher.png"
          test -s "$RES/ad_loading.webp"
          test -s "$RES/cover_placeholder_book.xml"
          test -s "$RES/cover_placeholder_comic.xml"
          test -s "$RES/cover_placeholder_document.xml"
          test -s "$RES/cover_placeholder_archive.xml"
          grep -q 'versionName .1.6.6.' InkFlowReader/app/build.gradle
          grep -q 'buildEmergency' "$TARGET/MainActivity.java"
          grep -q 'cover_placeholder_book' "$TARGET/CoverPlaceholderView.java"
          grep -q 'settingsLaunched=true' "$TARGET/BookReaderActivity.java"
          grep -q 'BookSettingsActivity.class' "$TARGET/BookReaderActivity.java"
          grep -q 'RESERVED_SLOT_DP=88' "$TARGET/BannerAdSlot.java"
          grep -q 'FALLBACK_BANNER_DP=50' "$TARGET/BannerAdSlot.java"
          grep -q 'nav_guard' "$TARGET/BannerAdSlot.java"
          grep -q 'buildCropSafePlaceholder' "$TARGET/BannerAdSlot.java"
          grep -q 'WindowInsets.Type.navigationBars' "$TARGET/BannerAdSlot.java"
          grep -q 'Gravity.BOTTOM' "$TARGET/BannerAdSlot.java"
          grep -q 'REFRESH_MS=35_000L' "$TARGET/BannerAdSlot.java"
          grep -q 'Ui.safeInsets(root,this,16,14,16,8)' "$TARGET/MainActivity.java"
          grep -q 'Ui.safeInsets(root,this,14,14,14,8)' "$TARGET/LibraryActivity.java"
          grep -q 'ad_content' "$TARGET/Ui.java"
          grep -q 'LibraryActivity' InkFlowReader/app/src/main/AndroidManifest.xml
          ! grep -R -q 'R-M-20002801-2' InkFlowReader/app/src/main || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned release APK
        run: gradle --no-daemon -p InkFlowReader assembleRelease --stacktrace

      - name: Align release and prepare signer
        run: |
          APK=$(find InkFlowReader/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$APK" Chitai-Vse-1.6.6-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 Chitai-Vse-1.6.6-aligned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ./apksigner.jar

      - name: Upload aligned release
        uses: actions/upload-artifact@v4
        with:
          name: Chitai-Vse-Release-Aligned-1.6.6
          path: |
            Chitai-Vse-1.6.6-aligned.apk
            apksigner.jar
          if-no-files-found: error
