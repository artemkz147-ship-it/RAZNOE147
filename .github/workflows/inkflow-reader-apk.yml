name: Build Читай Всё Release

on:
  push:
    branches: [main]
    paths:
      - 'inkflow_build_parts/**'
      - 'inkflow_patch_120/**'
      - 'inkflow_patch_130/**'
      - 'inkflow_patch_140/**'
      - '.github/workflows/inkflow-reader-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        run: |
          cat inkflow_build_parts/part00 inkflow_build_parts/part01 inkflow_build_parts/part02 inkflow_build_parts/part03 inkflow_build_parts/part04 | base64 --decode > InkFlowBuild.zip
          unzip -tq InkFlowBuild.zip
          unzip -q -o InkFlowBuild.zip

      - name: Add advanced reader and torrent center
        run: |
          TARGET=InkFlowReader/app/src/main/java/app/inkflow/reader
          cp inkflow_patch_120/BookContent.java "$TARGET/BookContent.java"
          cat inkflow_patch_120/BookSourceFactory.java.part00 inkflow_patch_120/BookSourceFactory.java.part01 inkflow_patch_120/BookSourceFactory.java.part02 > "$TARGET/BookSourceFactory.java"
          cp inkflow_patch_130/BookProgressStore.java "$TARGET/BookProgressStore.java"
          cat inkflow_patch_130/BookReaderActivity.java.part00 inkflow_patch_130/BookReaderActivity.java.part01 inkflow_patch_130/BookReaderActivity.java.part02 inkflow_patch_130/BookReaderActivity.java.part03 > "$TARGET/BookReaderActivity.java"
          cp inkflow_patch_130/BookSettingsActivity.java "$TARGET/BookSettingsActivity.java"
          cp inkflow_patch_140/TorrentService.java "$TARGET/TorrentService.java"
          cp inkflow_patch_140/TorrentActivity.java "$TARGET/TorrentActivity.java"
          cp inkflow_patch_140/InternetArchiveSearch.java "$TARGET/InternetArchiveSearch.java"
          python3 inkflow_patch_120/apply_120.py
          python3 inkflow_patch_130/apply_130.py
          python3 inkflow_patch_140/apply_140.py
          rm -f InkFlowReader/app/src/main/res/drawable/ic_launcher.xml InkFlowReader/app/src/main/res/drawable/ic_launcher.png
          cat inkflow_patch_140/icon64.part00 inkflow_patch_140/icon64.part01 inkflow_patch_140/icon64.part02 inkflow_patch_140/icon64.part03 | base64 --decode > InkFlowReader/app/src/main/res/drawable/ic_launcher.png
          test -s InkFlowReader/app/src/main/res/drawable/ic_launcher.png
          file InkFlowReader/app/src/main/res/drawable/ic_launcher.png | grep -q 'PNG image data'
          grep -q 'versionName .1.4.0.' InkFlowReader/app/build.gradle
          grep -q 'TorrentService' InkFlowReader/app/src/main/AndroidManifest.xml
          grep -q 'libtorrent4j' InkFlowReader/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned release APK
        run: gradle --no-daemon -p InkFlowReader assembleRelease --stacktrace

      - name: Align release and prepare signer
        run: |
          APK=$(find InkFlowReader/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$APK" Chitai-Vse-1.4.0-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 Chitai-Vse-1.4.0-aligned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ./apksigner.jar

      - name: Upload aligned release
        uses: actions/upload-artifact@v4
        with:
          name: Chitai-Vse-Release-Aligned-1.4.0
          path: |
            Chitai-Vse-1.4.0-aligned.apk
            apksigner.jar
          if-no-files-found: error
