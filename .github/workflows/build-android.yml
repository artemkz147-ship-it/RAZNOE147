name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [dino-encyclopedia-3d]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'tools/**'
      - 'data/**'
      - 'assets/**'
      - 'ASSET_CREDITS.md'
      - '.github/workflows/build-android.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_VERSION_ID: '4.7.2.stable'
      GLTFPACK_VERSION: '1.2.0'
      TREX_MODEL_URL: 'https://raw.githubusercontent.com/s010s/prehistoric-animal-museum/4d824cb1973861c1463b012cb0d6bc5976cf9c1f/src/content/animals/tyrannosaurus-rex/model/model.glb'
      TREX_MODEL_SHA256: 'ea15319ca1fa3724f1a961515c36b4834446f5ac30a9b0de49b62881877efa54'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert pinned CC BY T. rex model
        run: |
          mkdir -p assets/dinosaurs/tyrannosaurus_rex
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/trex-source.glb \
            "$TREX_MODEL_URL"
          echo "$TREX_MODEL_SHA256  /tmp/trex-source.glb" | sha256sum -c -

          npx --yes "gltfpack@${GLTFPACK_VERSION}" \
            -i /tmp/trex-source.glb \
            -o assets/dinosaurs/tyrannosaurus_rex/model.glb \
            -noq -kn -km -ke

          python3 - <<'PY'
          import json, struct
          path = 'assets/dinosaurs/tyrannosaurus_rex/model.glb'
          with open(path, 'rb') as f:
              magic, version, total = struct.unpack('<4sII', f.read(12))
              assert magic == b'glTF' and version == 2 and total > 1_000_000
              chunk_len, chunk_type = struct.unpack('<II', f.read(8))
              assert chunk_type == 0x4E4F534A
              doc = json.loads(f.read(chunk_len).decode('utf-8'))
          required = set(doc.get('extensionsRequired', []))
          used = set(doc.get('extensionsUsed', []))
          forbidden = {'EXT_meshopt_compression', 'KHR_meshopt_compression', 'KHR_mesh_quantization'}
          assert not (required & forbidden), f'Godot-incompatible required extensions remain: {required & forbidden}'
          assert not (used & {'EXT_meshopt_compression', 'KHR_meshopt_compression'}), 'Meshopt compression remains in output'
          animations = [a.get('name', '<unnamed>') for a in doc.get('animations', [])]
          print('converted GLB bytes:', total)
          print('extensions required:', sorted(required))
          print('extensions used:', sorted(used))
          print('nodes:', len(doc.get('nodes', [])))
          print('meshes:', len(doc.get('meshes', [])))
          print('materials:', len(doc.get('materials', [])))
          print('animations:', animations)
          assert doc.get('meshes'), 'No meshes in converted T. rex GLB'
          assert any('idle' in name.lower() for name in animations), 'Converted T. rex lost Idle animation'
          PY

      - name: Generate original T. rex bellow reconstruction
        run: |
          python3 tools/generate_trex_bellow.py
          test -s assets/audio/tyrannosaurus_rex/roar_reconstruction.wav
          sha256sum assets/audio/tyrannosaurus_rex/roar_reconstruction.wav

      - name: Use JDK 17
        run: |
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"

      - name: Verify Android SDK
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          test -x "${ANDROID_SDK_ROOT}/platform-tools/adb"

      - name: Install Godot 4.7.2 and export templates
        run: |
          curl -L --fail -o /tmp/godot.zip "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=${GODOT_VERSION}"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

          curl -L --fail -o /tmp/templates.tpz "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=${GODOT_VERSION}"
          mkdir -p /tmp/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_ID}"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_ID}/"
          godot --version

      - name: Import project without hidden errors
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E '(^|[[:space:]])(ERROR|SCRIPT ERROR):' /tmp/godot-import.log; then
            echo 'Godot asset/script import emitted an error.' >&2
            exit 1
          fi

      - name: Validate imported T. rex scene
        run: godot --headless --path . --script tools/validate_assets.gd

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android Debug" build/DinoEncyclopedia-debug.apk
          test -s build/DinoEncyclopedia-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoEncyclopedia-debug-apk
          path: build/DinoEncyclopedia-debug.apk
          if-no-files-found: error
