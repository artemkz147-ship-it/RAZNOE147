name: Final Shadowvale Source Polish

on:
  push:
    branches:
      - yandex-3d-survival-fantasy

permissions:
  contents: write

jobs:
  polish:
    if: github.event.head_commit.message != 'Polish Knight Palm.R weapon attachment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach sword to authored Knight hand bone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text(encoding='utf-8')
          old="""      if (!fallback && n.includes('hand')) fallback = o;
      if (!right && n.includes('hand') && (n.includes('right') || n.includes('.r') || n.includes('_r') || n.endsWith('r'))) right = o;"""
          new="""      if (!right && (n.includes('palm.r') || n.includes('palm_r') || n.includes('palm r'))) right = o;
      if (!fallback && (n.includes('hand') || n.includes('palm'))) fallback = o;
      if (!right && (n.includes('hand') || n.includes('palm')) && (n.includes('right') || n.includes('.r') || n.includes('_r') || n.endsWith('r'))) right = o;"""
          if old not in s and "n.includes('palm.r')" not in s:
              raise SystemExit('Expected attachment block not found')
          if old in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          node --check src/main.js
          grep -q "n.includes('palm.r')" src/main.js
      - name: Commit source polish
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Shadowvale Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.js
          git commit -m 'Polish Knight Palm.R weapon attachment'
          git push origin HEAD:yandex-3d-survival-fantasy
