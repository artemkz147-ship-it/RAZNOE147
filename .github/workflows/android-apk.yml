name: Android APK
on:
  push:
    branches: [main, iz-gryazi-v-knyazi-apk]
    paths:
      - 'iz-gryazi-v-knyazi/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test game rules
        run: npm test
        working-directory: iz-gryazi-v-knyazi
      - name: Bundle offline game
        run: |
          test -s iz-gryazi-v-knyazi/android/app/src/main/java/com/izgryazivknyazi/game/MainActivity.java
          mkdir -p iz-gryazi-v-knyazi/android/app/src/main/assets/game
          cp iz-gryazi-v-knyazi/index.html iz-gryazi-v-knyazi/android/app/src/main/assets/game/
          cp -R iz-gryazi-v-knyazi/src iz-gryazi-v-knyazi/android/app/src/main/assets/game/
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: iz-gryazi-v-knyazi/android
      - uses: actions/upload-artifact@v4
        with:
          name: iz-gryazi-v-knyazi-apk
          path: iz-gryazi-v-knyazi/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=iz-gryazi-v-knyazi/android/app/build/outputs/apk/debug/app-debug.apk
          tag=iz-gryazi-v-knyazi-${{ github.run_number }}
          gh release create "$tag" "$apk#iz-gryazi-v-knyazi.apk" \
            --target "$GITHUB_SHA" \
            --title "Из грязи в князи — APK ${{ github.run_number }}" \
            --notes "Портретная версия игры для Android. Установочный APK собран автоматически из этого коммита."
