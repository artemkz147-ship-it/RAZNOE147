name: Build Neon Apex APK

on:
  push:
    branches: ["neon-rush-3d-racing"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web game
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Force landscape racing mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          needle = 'android:name=".MainActivity"'
          if 'android:screenOrientation=' not in s:
              s = s.replace(needle, needle + '\n            android:screenOrientation="landscape"')
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Neon-Apex-Racing-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Apex-Racing-APK
          path: out/Neon-Apex-Racing-debug.apk
          if-no-files-found: error
          retention-days: 30
