name: Android release APK
on:
  push:
    branches: [main, iz-gryazi-v-knyazi-apk]
    paths:
      - 'iz-gryazi-v-knyazi/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test game rules
        run: npm test
        working-directory: iz-gryazi-v-knyazi
      - name: Bundle offline game
        run: |
          test -s iz-gryazi-v-knyazi/android/app/src/main/java/com/izgryazivknyazi/game/MainActivity.java
          mkdir -p iz-gryazi-v-knyazi/android/app/src/main/assets/game
          cp iz-gryazi-v-knyazi/index.html iz-gryazi-v-knyazi/android/app/src/main/assets/game/
          cp -R iz-gryazi-v-knyazi/src iz-gryazi-v-knyazi/android/app/src/main/assets/game/
      - name: Prepare release signing when configured
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/game-release.p12"
            chmod 600 "$RUNNER_TEMP/game-release.p12"
            echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/game-release.p12" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        working-directory: iz-gryazi-v-knyazi/android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      - name: Verify release manifest and prepare artifacts
        id: release
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apkdir=iz-gryazi-v-knyazi/android/app/build/outputs/apk/release
          mkdir -p release-output
          if [ -s "$apkdir/app-release.apk" ]; then
            apk="$apkdir/app-release.apk"
            "$tools/apksigner" verify --verbose --print-certs "$apk" > release-output/signature-verification.txt
            ! grep -q 'CN=Android Debug' release-output/signature-verification.txt
            cp "$apk" release-output/iz-gryazi-v-knyazi-release.apk
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            apk="$apkdir/app-release-unsigned.apk"
            test -s "$apk"
            cp "$apk" release-output/iz-gryazi-v-knyazi-release-unsigned.apk
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi
          "$tools/aapt" dump badging "$apk" > release-output/apk-metadata.txt
          ! grep -q '^application-debuggable' release-output/apk-metadata.txt
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > release-output/AndroidManifest.txt
          ! grep -Eq 'android:debuggable.*0xffffffff' release-output/AndroidManifest.txt
          cp "$tools/lib/apksigner.jar" release-output/apksigner.jar
          cp "$apkdir/output-metadata.json" release-output/output-metadata.json
          sha256sum release-output/*.apk > release-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iz-gryazi-v-knyazi-release-build
          path: release-output/
          if-no-files-found: error
      - name: Publish unsigned signing input for local release signing
        if: steps.release.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=iz-gryazi-v-knyazi-signing-input-${{ github.run_number }}
          gh release create "$tag" \
            release-output/iz-gryazi-v-knyazi-release-unsigned.apk \
            release-output/apksigner.jar \
            release-output/apk-metadata.txt \
            --prerelease --target "$GITHUB_SHA" \
            --title "Release signing input ${{ github.run_number }} — not an installable APK" \
            --notes "Production release compilation with debugging disabled. This input requires the permanent local release key before installation or store upload. No signing credentials are included."
      - name: Publish signed release APK
        if: steps.release.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=release-output/iz-gryazi-v-knyazi-release.apk
          tag=iz-gryazi-v-knyazi-release-${{ github.run_number }}
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Из грязи в князи — release APK ${{ github.run_number }}" \
            --notes "Подписанная release-сборка для Android. Отладка отключена."
