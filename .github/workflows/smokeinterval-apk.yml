name: Build SmokeInterval APK

on:
  push:
    branches: [main]
    paths:
      - 'smokeinterval_v12/**'
      - '.github/workflows/smokeinterval-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        run: |
          cat smokeinterval_v12/source.part00 smokeinterval_v12/source.part01 smokeinterval_v12/source.part02 smokeinterval_v12/source.part03 > smokeinterval_v12/source.b64
          base64 --decode smokeinterval_v12/source.b64 > SmokeInterval-v1.2-source.zip
          unzip -tq SmokeInterval-v1.2-source.zip
          unzip -q -o SmokeInterval-v1.2-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable debug APK
        run: gradle --no-daemon -p SmokeInterval assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          APK=$(find SmokeInterval/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" SmokeInterval-v1.2.apk
          sha256sum SmokeInterval-v1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmokeInterval-v1.2-APK
          path: SmokeInterval-v1.2.apk
          if-no-files-found: error
