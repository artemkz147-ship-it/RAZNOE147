name: Build SmokeInterval APK

on:
  push:
    branches: [main]
    paths:
      - 'smokeinterval_v12/**'
      - 'smokeinterval_v13/**'
      - 'smokeinterval_v13b/**'
      - 'smokeinterval_v14/**'
      - 'smokeinterval_v14c/**'
      - 'smokeinterval_v15/**'
      - 'smokeinterval_v17/**'
      - '.github/workflows/smokeinterval-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore v1.2 source
        run: |
          cat smokeinterval_v12/source.part00 smokeinterval_v12/source.part01 smokeinterval_v12/source.part02 smokeinterval_v12/source.part03 > smokeinterval_v12/source.b64
          base64 --decode smokeinterval_v12/source.b64 > SmokeInterval-v1.2-source.zip
          unzip -tq SmokeInterval-v1.2-source.zip
          unzip -q -o SmokeInterval-v1.2-source.zip

      - name: Apply v1.3 sleep-mode patch
        run: |
          cat smokeinterval_v13b/patch64.part00 smokeinterval_v13b/patch64.part01 smokeinterval_v13b/patch64.part02 smokeinterval_v13b/patch64.part03 smokeinterval_v13b/patch64.part04 smokeinterval_v13b/patch64.part05 > smokeinterval_v13b/v1.3.patch.b64
          base64 --decode smokeinterval_v13b/v1.3.patch.b64 > smokeinterval_v13b/v1.3.patch
          patch -p1 < smokeinterval_v13b/v1.3.patch
          grep -q "versionName '1.3.0'" SmokeInterval/app/build.gradle

      - name: Apply v1.4 UI and settings redesign
        run: |
          cat smokeinterval_v14c/main.part00 smokeinterval_v14c/main.part01 smokeinterval_v14c/main.part02 smokeinterval_v14c/main.part03 > smokeinterval_v14c/main.b64
          cat smokeinterval_v14c/settings.part00 smokeinterval_v14c/settings.part01 smokeinterval_v14c/settings.part02 > smokeinterval_v14c/settings.b64
          base64 --decode smokeinterval_v14c/main.b64 > smokeinterval_v14c/main.gz
          base64 --decode smokeinterval_v14c/settings.b64 > smokeinterval_v14c/settings.gz
          gzip -t smokeinterval_v14c/main.gz
          gzip -t smokeinterval_v14c/settings.gz
          gzip -dc smokeinterval_v14c/main.gz > SmokeInterval/app/src/main/java/com/example/smokeinterval/MainActivity.java
          gzip -dc smokeinterval_v14c/settings.gz > SmokeInterval/app/src/main/java/com/example/smokeinterval/SettingsActivity.java
          sed -i "s/versionCode 4/versionCode 5/" SmokeInterval/app/build.gradle
          sed -i "s/versionName '1.3.0'/versionName '1.4.0'/" SmokeInterval/app/build.gradle
          grep -q "versionName '1.4.0'" SmokeInterval/app/build.gradle
          grep -q 'План уже запущен' SmokeInterval/app/src/main/java/com/example/smokeinterval/MainActivity.java
          grep -q 'Разрешения' SmokeInterval/app/src/main/java/com/example/smokeinterval/SettingsActivity.java

      - name: Apply v1.5 configurable interval patch
        run: |
          cat smokeinterval_v15/patch.part00 smokeinterval_v15/patch.part01 > smokeinterval_v15/patch.gz.b64
          base64 --decode smokeinterval_v15/patch.gz.b64 > smokeinterval_v15/patch.gz
          gzip -t smokeinterval_v15/patch.gz
          gzip -dc smokeinterval_v15/patch.gz > smokeinterval_v15/v1.5.patch
          patch -p4 < smokeinterval_v15/v1.5.patch
          grep -q "versionName '1.5.0'" SmokeInterval/app/build.gradle
          grep -q 'getBaseIntervalMin' SmokeInterval/app/src/main/java/com/example/smokeinterval/PlanStore.java
          grep -q 'Нажми на параметр' SmokeInterval/app/src/main/java/com/example/smokeinterval/SettingsActivity.java

      - name: Apply v1.7 Yandex banner and rename patch
        run: |
          base64 --decode smokeinterval_v17/patch.gz.b64 > smokeinterval_v17/patch.gz
          gzip -t smokeinterval_v17/patch.gz
          gzip -dc smokeinterval_v17/patch.gz > smokeinterval_v17/v1.7.patch
          patch -p1 < smokeinterval_v17/v1.7.patch
          grep -q "versionName '1.7.0'" SmokeInterval/app/build.gradle
          grep -q 'Шаг без сигарет — курить реже' SmokeInterval/app/src/main/res/values/strings.xml
          grep -q 'R-M-20150071-1' SmokeInterval/app/src/main/java/com/example/smokeinterval/YandexBannerStripView.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable debug APK
        run: gradle --no-daemon -p SmokeInterval assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          APK=$(find SmokeInterval/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" Shag-bez-sigaret-v1.7.apk
          sha256sum Shag-bez-sigaret-v1.7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shag-bez-sigaret-v1.7-APK
          path: Shag-bez-sigaret-v1.7.apk
          if-no-files-found: error
