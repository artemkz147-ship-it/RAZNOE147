name: Build Offline100 v1.1 Visual APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'offline100-apk/**'
      - '.github/workflows/offline100-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Restore v1.1 visual game assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline100-apk/app/src/main/assets
          cat offline100-apk/.payload/app.* | base64 -d | gzip -d > offline100-apk/app/src/main/assets/app.js
          cat offline100-apk/.payload/style.* | base64 -d | gzip -d > offline100-apk/app/src/main/assets/styles.css
          cat offline100-apk/.payload/index.* | base64 -d | gzip -d > offline100-apk/app/src/main/assets/index.html
          base64 -d < offline100-apk/.payload/v11-app.patch.gz.b64 | gzip -d > /tmp/v11-app.patch
          base64 -d < offline100-apk/.payload/v11-styles.patch.gz.b64 | gzip -d > /tmp/v11-styles.patch
          patch offline100-apk/app/src/main/assets/app.js < /tmp/v11-app.patch
          patch offline100-apk/app/src/main/assets/styles.css < /tmp/v11-styles.patch
          test $(wc -c < offline100-apk/app/src/main/assets/app.js) -eq 212277
          test $(wc -c < offline100-apk/app/src/main/assets/styles.css) -eq 74907
          test $(wc -c < offline100-apk/app/src/main/assets/index.html) -eq 12839
          grep -q "1.1.0" offline100-apk/app/src/main/assets/app.js

      - name: Build installable debug APK
        working-directory: offline100-apk
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline100-v1.1-visual-debug-apk
          path: offline100-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
