name: Build Physics Playground 4.0 Quality APK

on:
  push:
    branches: [physics-playground-4.0-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified 2.0 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p physics-build
          cat physics-playground-build/part*.b64 | tr -d '\r\n' | base64 -d > physics-build/base.zip
          echo "bbf59db97d7b72468b20253be6e5be4dc73091f35ccab2c3f55a64584dc32b8e  physics-build/base.zip" | sha256sum -c -
          unzip -q physics-build/base.zip -d physics-build/src
          python3 physics-playground-3-patch/apply_patch.py

      - name: Download CC0 3D model packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kenney/factory /tmp/kenney/toy
          curl --retry 3 -fL "https://kenney.nl/media/pages/assets/factory-kit/edaac9d4f6-1777639602/kenney_factory-kit_3.0.zip" -o /tmp/factory.zip
          curl --retry 3 -fL "https://www.kenney.nl/media/pages/assets/toy-car-kit/42e19cc426-1736346027/kenney_toy-car-kit.zip" -o /tmp/toy.zip
          unzip -q /tmp/factory.zip -d /tmp/kenney/factory
          unzip -q /tmp/toy.zip -d /tmp/kenney/toy
          python3 -m pip install --quiet numpy trimesh
          python3 physics-playground-3-patch/prepare_assets.py
          test "$(find physics-build/src/physics2/app/src/main/assets/models -name '*.obj' | wc -l)" -ge 18

      - name: Bundle recorded CC0 sounds
        shell: bash
        run: |
          set -euo pipefail
          RAW=physics-build/src/physics2/app/src/main/res/raw
          mkdir -p "$RAW"
          IMP="https://raw.githubusercontent.com/Boyquotes/kenney-impact-sounds-for-godot/main/addons/kenney%20impact%20sounds"
          SCI="https://raw.githubusercontent.com/Boyquotes/kenney-sci-fi-sounds-for-godot/main/addons/kenney%20sci-fi%20sounds"
          curl -fL "$IMP/impact_wood_heavy_000.ogg" -o "$RAW/sfx_wood_1.ogg"
          curl -fL "$IMP/impact_wood_heavy_001.ogg" -o "$RAW/sfx_wood_2.ogg"
          curl -fL "$IMP/impact_wood_heavy_002.ogg" -o "$RAW/sfx_wood_3.ogg"
          curl -fL "$IMP/impact_metal_heavy_000.ogg" -o "$RAW/sfx_metal_1.ogg"
          curl -fL "$IMP/impact_metal_heavy_001.ogg" -o "$RAW/sfx_metal_2.ogg"
          curl -fL "$IMP/impact_metal_heavy_002.ogg" -o "$RAW/sfx_metal_3.ogg"
          curl -fL "$IMP/impact_glass_heavy_000.ogg" -o "$RAW/sfx_glass_1.ogg"
          curl -fL "$IMP/impact_glass_heavy_001.ogg" -o "$RAW/sfx_glass_2.ogg"
          curl -fL "$IMP/impact_glass_heavy_002.ogg" -o "$RAW/sfx_glass_3.ogg"
          curl -fL "$IMP/impact_soft_heavy_000.ogg" -o "$RAW/sfx_soft_1.ogg"
          curl -fL "$IMP/impact_soft_heavy_001.ogg" -o "$RAW/sfx_soft_2.ogg"
          curl -fL "$IMP/impact_soft_heavy_002.ogg" -o "$RAW/sfx_soft_3.ogg"
          curl -fL "$IMP/impact_generic_light_000.ogg" -o "$RAW/sfx_generic_1.ogg"
          curl -fL "$IMP/impact_generic_light_001.ogg" -o "$RAW/sfx_generic_2.ogg"
          curl -fL "$SCI/explosion_crunch_000.ogg" -o "$RAW/sfx_explosion_1.ogg"
          test "$(find "$RAW" -name '*.ogg' | wc -l)" -ge 15

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }

      - name: Physics regression tests
        run: cd physics-build/src/physics2 && gradle --no-daemon :core:runPhysicsCoreTest

      - name: Build 4.0 debug APK
        run: cd physics-build/src/physics2 && gradle --no-daemon :app:assembleDebug

      - name: Verify 4.0 APK content
        shell: bash
        run: |
          set -euo pipefail
          APK=physics-build/src/physics2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/models/wheel.obj'
          unzip -l "$APK" | grep -q 'assets/models/wheel2.obj'
          unzip -l "$APK" | grep -q 'assets/models/gear.obj'
          unzip -l "$APK" | grep -q 'assets/models/barrel.obj'
          unzip -l "$APK" | grep -q 'assets/models/platform.obj'
          unzip -l "$APK" | grep -q 'res/raw/sfx_wood_1.ogg'
          unzip -l "$APK" | grep -q 'res/raw/sfx_explosion_1.ogg'
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Physics-Playground-4.0-quality-debug
          path: physics-build/src/physics2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
