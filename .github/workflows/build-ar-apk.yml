name: Build AR Space Breach APK
on:
  push:
    branches: [ "ar-space-breach-build" ]
    paths:
      - "ar-space-breach/**"
      - ".github/workflows/build-ar-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Rebuild and patch Kotlin source
        run: |
          mkdir -p ar-space-breach/app/src/main/java/com/artem/arspacebreach
          cat ar-space-breach/buildparts/main.b64.* | tr -d '\n' | base64 -d > ar-space-breach/app/src/main/java/com/artem/arspacebreach/MainActivity.kt
          SRC=ar-space-breach/app/src/main/java/com/artem/arspacebreach/MainActivity.kt
          sed -i '/import androidx.compose.foundation.layout.weight/d' "$SRC"
          sed -i '/import io.github.sceneview.material.createColorInstance/d' "$SRC"
          sed -i 's/Modifier.weight(1f).height(62.dp)/Modifier.size(width = 160.dp, height = 62.dp)/' "$SRC"
          sed -i 's/^[[:space:]]*\.weight(1f)$/                        .size(width = 160.dp, height = 62.dp)/' "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ar-space-breach/app/src/main/java/com/artem/arspacebreach/MainActivity.kt')
          s = p.read_text()
          anchor = 'import androidx.compose.foundation.layout.size\n'
          extra = (
              'import androidx.compose.foundation.layout.WindowInsets\n'
              'import androidx.compose.foundation.layout.safeDrawing\n'
              'import androidx.compose.foundation.layout.windowInsetsPadding\n'
          )
          if 'windowInsetsPadding' not in s:
              s = s.replace(anchor, anchor + extra)
          s = s.replace('Modifier.fillMaxSize()', 'Modifier.fillMaxSize().windowInsetsPadding(WindowInsets.safeDrawing)')
          p.write_text(s)
          PY
          echo '--- SCAN LOGIC ---'
          grep -nE 'scanText|Plane\.Type|extent|TrackingState|lastBreachSpawn|Breach|breach|plane|Plane' "$SRC" | head -n 180 || true
      - name: Build debug APK
        working-directory: ar-space-breach
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Prepare artifact
        run: cp ar-space-breach/app/build/outputs/apk/debug/app-debug.apk AR-Space-Breach.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AR-Space-Breach-APK
          path: AR-Space-Breach.apk
