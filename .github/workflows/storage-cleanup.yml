name: One-time storage cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storage-cleanup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete artifacts, caches, releases and branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepBranches = new Set(['main', 'ps2-autotune-android', 'ps2-autotune-ci-base']);
            const isPuzzle = s => /video[\s_-]*puzzle|videopuzzle|puzzle/i.test(s || '');
            const isEmulator = s => /ps2|autotune|emulator/i.test(s || '');

            // Artifacts: retain every video-puzzle artifact and only the newest emulator artifact.
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const puzzleArtifacts = artifacts.filter(a => isPuzzle(a.name) || isPuzzle(a.workflow_run?.head_branch));
            const emulatorArtifacts = artifacts
              .filter(a => isEmulator(a.name) || isEmulator(a.workflow_run?.head_branch))
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            const keepArtifactIds = new Set(puzzleArtifacts.map(a => a.id));
            if (emulatorArtifacts[0]) keepArtifactIds.add(emulatorArtifacts[0].id);
            for (const a of artifacts) {
              if (!keepArtifactIds.has(a.id)) {
                try {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                  core.info(`Deleted artifact ${a.id} ${a.name}`);
                } catch (e) {
                  core.warning(`Artifact ${a.id}: ${e.message}`);
                }
              }
            }

            // Caches are rebuildable and can consume Actions storage.
            try {
              const caches = await github.paginate('GET /repos/{owner}/{repo}/actions/caches', { owner, repo, per_page: 100 });
              for (const c of caches) {
                try {
                  await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', { owner, repo, cache_id: c.id });
                  core.info(`Deleted cache ${c.id}`);
                } catch (e) {
                  core.warning(`Cache ${c.id}: ${e.message}`);
                }
              }
            } catch (e) {
              core.warning(`Cache listing: ${e.message}`);
            }

            // Releases: keep all puzzle releases and only the newest emulator release.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const puzzleReleases = releases.filter(r => isPuzzle(`${r.name} ${r.tag_name} ${r.target_commitish}`));
            const emulatorReleases = releases
              .filter(r => isEmulator(`${r.name} ${r.tag_name} ${r.target_commitish}`))
              .sort((a,b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));
            const keepReleaseIds = new Set(puzzleReleases.map(r => r.id));
            if (emulatorReleases[0]) keepReleaseIds.add(emulatorReleases[0].id);
            for (const r of releases) {
              if (!keepReleaseIds.has(r.id)) {
                try {
                  await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id });
                  core.info(`Deleted release ${r.id} ${r.tag_name}`);
                } catch (e) {
                  core.warning(`Release ${r.id}: ${e.message}`);
                }
              }
            }

            // Delete obsolete project branches. Preserve puzzle branches defensively.
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            for (const b of branches) {
              if (!keepBranches.has(b.name) && !isPuzzle(b.name)) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${b.name}` });
                  core.info(`Deleted branch ${b.name}`);
                } catch (e) {
                  core.warning(`Branch ${b.name}: ${e.message}`);
                }
              }
            }

            core.info(`Kept ${keepArtifactIds.size} artifact(s), ${keepReleaseIds.size} release(s).`);
