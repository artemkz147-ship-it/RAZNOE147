name: Catalog Nature Assets
on:
  push:
    branches: [yandex-3d-merry-mayhem]
permissions:
  contents: write
jobs:
  catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nature
          curl -fL --retry 4 'https://opengameart.org/sites/default/files/ultimate_nature_pack_by_quaternius_1.zip' -o /tmp/nature.zip
          unzip -q /tmp/nature.zip -d /tmp/nature
          find /tmp/nature -type f -iname '*.fbx' | sed 's#^.*/##' | sort > .build/nature-catalog.txt
          echo '--- terrain/ground/grass candidates ---'
          grep -Ei 'ground|grass|terrain|sand|snow|dirt|path|plane|floor|cliff|mountain' .build/nature-catalog.txt || true
          git config user.name 'Merry Mayhem Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .build/nature-catalog.txt
          git commit -m 'Record nature asset catalog'
          git push origin HEAD:yandex-3d-merry-mayhem
