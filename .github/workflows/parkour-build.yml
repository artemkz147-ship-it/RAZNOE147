name: Build Drop Flow DF7

on:
  push:
    branches: [yandex-parkour]
    paths:
      - 'parkour/**'
      - '.github/workflows/parkour-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'parkour/**'
      - '.github/workflows/parkour-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parkour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install asset builder
        run: python -m pip install -r requirements-assets.txt
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build DF7 physics game
        run: npm run build
      - name: Verify DF7 asset namespace
        run: |
          test -d dist/assets3d_df7_20260819
          test ! -d dist/assets3d
          test ! -d dist/assets3d_df6_20260818
          grep -q 'DROP FLOW BUILD DF7-20260819-A' dist/build-id.txt
          grep -q 'assets3d_df7_20260819/ui/landing-target.svg' dist/index.html
          grep -q 'BUILD DF7' dist/index.html
      - name: Install Chromium for visual QA
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
      - name: Physics and visual gameplay QA
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/drop-flow-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          node tools/qa_screenshot.mjs
      - name: Upload DF7 gameplay QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drop-flow-df7-visual-qa
          path: parkour/qa
          if-no-files-found: warn
      - name: Create DF7 Yandex Games ZIP
        run: |
          cd dist
          zip -r ../drop-flow-df7-yandex.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: drop-flow-df7-yandex
          path: parkour/drop-flow-df7-yandex.zip
          if-no-files-found: error
