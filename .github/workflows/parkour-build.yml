name: Build Vertical 3D Parkour

on:
  push:
    branches: [yandex-parkour]
    paths:
      - 'parkour/**'
      - '.github/workflows/parkour-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'parkour/**'
      - '.github/workflows/parkour-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parkour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install 3D asset builder
        run: python -m pip install -r requirements-assets.txt
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check, bake GLB assets and build
        run: npm run build
      - name: Create Yandex Games ZIP
        run: |
          cd dist
          zip -r ../vertical-3d-parkour-yandex.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: vertical-3d-parkour-yandex
          path: parkour/vertical-3d-parkour-yandex.zip
          if-no-files-found: error
