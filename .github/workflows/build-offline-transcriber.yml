name: Build Offline Video Transcriber APK

on:
  push:
    branches: [ feature/offline-transcriber ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore and verify project archive
        run: |
          cat \
            transcriber_build/transcriber.part.00 \
            transcriber_build/transcriber.part.01 \
            transcriber_build/transcriber.part.02 \
            transcriber_build/transcriber.part.03a \
            transcriber_build/transcriber.part.03b0 \
            transcriber_build/transcriber.part.03b1 \
            transcriber_build/transcriber.part.03b2 \
            transcriber_build/transcriber.part.03b3 \
            transcriber_build/transcriber.part.04 \
            | base64 -d > /tmp/offline-video-transcriber-v0.1.zip
          echo "3bd721832a64892969e95555e8ca7b33a0270b5fd281b780b90e7926a941c0c8  /tmp/offline-video-transcriber-v0.1.zip" | sha256sum -c -
          unzip -t /tmp/offline-video-transcriber-v0.1.zip
          rm -rf transcriber-build
          mkdir transcriber-build
          unzip -q /tmp/offline-video-transcriber-v0.1.zip -d transcriber-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare runtime and embedded models
        working-directory: transcriber-build
        run: |
          chmod +x scripts/*.sh
          ./scripts/prepare_sherpa.sh
          ./scripts/prepare_models.sh
          du -h app/libs/* app/src/main/assets/* || true

      - name: Pure Kotlin tests
        working-directory: transcriber-build
        run: ./scripts/run_pure_tests.sh

      - name: Build release APK
        working-directory: transcriber-build
        run: gradle --no-daemon testDebugUnitTest assembleRelease --stacktrace

      - name: Verify APK
        working-directory: transcriber-build
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$APK" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "INTERNET permission must not be present" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: offline-video-transcriber-arm64
          path: transcriber-build/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
