name: Deploy StoryBook AI Worker

on:
  workflow_dispatch:
  push:
    branches: [ "storybook-ai-v1" ]
    paths:
      - "storybook-ai/backend/**"
      - ".github/workflows/deploy-storybook-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore worker source
        run: |
          cat storybook-ai/backend/worker.js.gz.part* > /tmp/worker.js.gz
          gzip -t /tmp/worker.js.gz
          gzip -dc /tmp/worker.js.gz > storybook-ai/backend/worker.js
      - name: Validate required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "Missing OPENAI_API_KEY" && exit 1)
      - name: Deploy worker
        working-directory: storybook-ai/backend
        run: npx --yes wrangler@latest deploy
      - name: Set OpenAI secret
        working-directory: storybook-ai/backend
        run: printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@latest secret put OPENAI_API_KEY
      - name: Verify deployment
        working-directory: storybook-ai/backend
        run: npx --yes wrangler@latest deployments list
