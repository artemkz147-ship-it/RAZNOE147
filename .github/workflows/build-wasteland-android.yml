name: Build Wasteland Android

on:
  push:
    branches:
      - wasteland-godot-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild project payload
        shell: bash
        run: |
          mkdir -p wasteland
          cat wasteland_payload/part_* | base64 -d > /tmp/wasteland_source.zip
          echo "50b9efee7386f8ff4d76cec3e9431f80cab6dfcad6c9adb437fcfd3c1b345e8f  /tmp/wasteland_source.zip" | sha256sum -c -
          unzip -t /tmp/wasteland_source.zip
          unzip -o /tmp/wasteland_source.zip -d wasteland
          test -f wasteland/project.godot
          test -f wasteland/scripts/game.gd

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Export with Godot 4.7.2
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./wasteland
          presets_to_export: Android
          export_debug: true
          archive_output: false
          cache: true
          verbose: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wasteland-Circuit-Godot-v1.3.1-fixed
          path: ${{ steps.export.outputs.build_directory }}/**/*.apk
          if-no-files-found: error
