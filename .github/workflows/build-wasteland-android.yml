name: Build Wasteland Android

on:
  push:
    branches:
      - wasteland-godot-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild v1.4 race project
        shell: bash
        run: |
          mkdir -p wasteland
          cat wasteland_payload/part_* | base64 -d > /tmp/wasteland_source.zip
          unzip -o /tmp/wasteland_source.zip -d wasteland || true
          cp wasteland/game_override.gd wasteland/scripts/game.gd
          cp wasteland/combat_car_override.gd wasteland/scripts/combat_car.gd
          cp wasteland/hud_override.gd wasteland/scripts/hud.gd
          python3 - <<'PY'
          from pathlib import Path

          rocket = Path('wasteland/scripts/rocket.gd')
          r = rocket.read_text()
          old = 'var desired := (target.global_position + Vector3.UP * 0.65 - global_position).normalized()'
          new = 'var desired: Vector3 = (target.global_position + Vector3.UP * 0.65 - global_position).normalized()'
          if old in r:
              r = r.replace(old, new)
          rocket.write_text(r)

          project = Path('wasteland/project.godot')
          t = project.read_text()
          wrong = 'rendering/textures/vram_compression/import_etc2_astc=true'
          correct = 'textures/vram_compression/import_etc2_astc=true'
          t = t.replace(wrong + '\n', '')
          if correct not in t:
              if '[rendering]\n' not in t:
                  raise SystemExit('Missing [rendering] section')
              t = t.replace('[rendering]\n', '[rendering]\n' + correct + '\n', 1)
          project.write_text(t)

          preset = Path('wasteland/export_presets.cfg')
          p = preset.read_text()
          import re
          p = re.sub(r'package/unique_name="[^"]+"', 'package/unique_name="ru.openai148.wastelandcircuit.race"', p)
          p = re.sub(r'package/name="[^"]+"', 'package/name="Wasteland Circuit Race"', p)
          p = re.sub(r'version/code=\d+', 'version/code=14', p)
          p = re.sub(r'version/name="[^"]+"', 'version/name="1.4.0"', p)
          p = re.sub(r'export_path="[^"]+"', 'export_path="builds/Wasteland-Circuit-Race-v1.4.0.apk"', p)
          preset.write_text(p)
          PY
          rm -rf wasteland/.godot
          grep -n "drift_boosted\|_detach_part\|vehicle_name" wasteland/scripts/combat_car.gd
          grep -n "PATH_SEGMENTS\|_race_position\|_build_boost_pads" wasteland/scripts/game.gd
          grep -n "set_race_position\|set_drift_charge\|ДРИФТ" wasteland/scripts/hud.gd
          grep -n "^textures/vram_compression/import_etc2_astc=true$" wasteland/project.godot
          grep -n "version/name=\|package/unique_name=" wasteland/export_presets.cfg

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Export with Godot 4.7.2
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./wasteland
          presets_to_export: Android
          export_debug: true
          archive_output: false
          cache: true
          verbose: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wasteland-Circuit-Race-v1.4.0
          path: ${{ steps.export.outputs.build_directory }}/**/*.apk
          if-no-files-found: error
