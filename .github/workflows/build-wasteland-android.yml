name: Build Wasteland Android

on:
  push:
    branches:
      - wasteland-godot-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild v1.6.2 fixed project
        shell: bash
        run: |
          mkdir -p wasteland
          cat wasteland_payload/part_* | base64 -d > /tmp/wasteland_source.zip
          unzip -o /tmp/wasteland_source.zip -d wasteland || true
          cp wasteland/game_override.gd wasteland/scripts/game.gd
          cp wasteland/combat_car_override.gd wasteland/scripts/combat_car.gd
          cp wasteland/hud_override.gd wasteland/scripts/hud.gd

          mkdir -p wasteland/assets/kenney/vehicles wasteland/assets/kenney/debris wasteland/assets/kenney/city
          BASE="https://raw.githubusercontent.com/Arslan12216775/kenney_car-kit/master/Models/GLB%20format"
          CITY="https://raw.githubusercontent.com/Arslan12216775/kenney_car-kit/master/Models/City"
          fetch_asset() { curl -L --fail --retry 4 --retry-delay 2 "$1" -o "$2"; }

          fetch_asset "$BASE/race.glb" wasteland/assets/kenney/vehicles/race.glb
          fetch_asset "$BASE/hatchback-sports.glb" wasteland/assets/kenney/vehicles/hatchback-sports.glb
          fetch_asset "$BASE/suv.glb" wasteland/assets/kenney/vehicles/suv.glb
          fetch_asset "$BASE/race-future.glb" wasteland/assets/kenney/vehicles/race-future.glb
          fetch_asset "$BASE/firetruck.glb" wasteland/assets/kenney/vehicles/firetruck.glb
          fetch_asset "$BASE/delivery.glb" wasteland/assets/kenney/vehicles/delivery.glb
          fetch_asset "$BASE/sedan-sports.glb" wasteland/assets/kenney/vehicles/sedan-sports.glb
          fetch_asset "$BASE/garbage-truck.glb" wasteland/assets/kenney/vehicles/garbage-truck.glb

          fetch_asset "$BASE/debris-door.glb" wasteland/assets/kenney/debris/debris-door.glb
          fetch_asset "$BASE/debris-bumper.glb" wasteland/assets/kenney/debris/debris-bumper.glb
          fetch_asset "$BASE/debris-spoiler-a.glb" wasteland/assets/kenney/debris/debris-spoiler-a.glb
          fetch_asset "$BASE/debris-plate-a.glb" wasteland/assets/kenney/debris/debris-plate-a.glb
          fetch_asset "$BASE/debris-plate-b.glb" wasteland/assets/kenney/debris/debris-plate-b.glb
          fetch_asset "$BASE/debris-tire.glb" wasteland/assets/kenney/debris/debris-tire.glb
          fetch_asset "$BASE/debris-drivetrain.glb" wasteland/assets/kenney/debris/debris-drivetrain.glb
          fetch_asset "$BASE/cone.glb" wasteland/assets/kenney/city/cone.glb

          for letter in a b c d e f g h i j k l m n o p; do
            fetch_asset "$CITY/building-type-$letter.glb" "wasteland/assets/kenney/city/building-type-$letter.glb"
          done
          fetch_asset "$CITY/fence.glb" wasteland/assets/kenney/city/fence.glb
          fetch_asset "https://raw.githubusercontent.com/Arslan12216775/kenney_car-kit/master/License.txt" wasteland/assets/kenney/LICENSE.txt

          python3 wasteland/ci_patch_v162.py
          rm -rf wasteland/.godot

          test -s wasteland/assets/kenney/vehicles/sedan-sports.glb
          test -s wasteland/assets/kenney/vehicles/garbage-truck.glb
          grep -n "MainMenuRoot\|get_visible_rect\|ci-race" wasteland/scripts/game.gd
          grep -n "starting_gun_ammo\|drift_stage\|_update_wheel_damage" wasteland/scripts/combat_car.gd
          ! grep -R "posmodi(" wasteland/scripts
          grep -n "version/name=\|package/unique_name=" wasteland/export_presets.cfg

      - name: Runtime smoke test with Godot 4.7.2
        shell: bash
        run: |
          curl -L --fail --retry 4 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          chmod +x "$GODOT"

          "$GODOT" --headless --editor --path wasteland --quit 2>&1 | tee /tmp/wc-import.log

          set +e
          timeout 18s "$GODOT" --headless --path wasteland --quit-after 240 -- --ci-race 2>&1 | tee /tmp/wc-runtime.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Attempt to call|Cannot call method" /tmp/wc-import.log /tmp/wc-runtime.log; then
            echo "Runtime smoke test found a Godot script error"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "Godot runtime exited with status $STATUS"
            exit "$STATUS"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Export with Godot 4.7.2
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./wasteland
          presets_to_export: Android
          export_debug: true
          archive_output: false
          cache: true
          verbose: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wasteland-Circuit-Race-v1.6.2-fixed
          path: ${{ steps.export.outputs.build_directory }}/**/*.apk
          if-no-files-found: error
