name: Build PS2 AutoTune APK

on:
  push:
    branches: [ps2-autotune-android]
    paths:
      - 'ps2-autotune/**'
      - '.github/workflows/build-ps2-autotune.yml'
  pull_request:
    branches: [main, ps2-autotune-ci-base]
    paths:
      - 'ps2-autotune/**'
      - '.github/workflows/build-ps2-autotune.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps2-autotune-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REF: '2.6.5.9'
  ANDROID_BUILD_TOOLS: '37.0.0'

jobs:
  android:
    name: Android arm64 universal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout AutoTune overlay
        uses: actions/checkout@v5

      - name: Checkout ARMSX2 source
        shell: bash
        run: |
          git clone --recursive --depth 1 --branch "$UPSTREAM_REF" https://github.com/ARMSX2/ARMSX2.git upstream
          echo "UPSTREAM_SHA=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply AutoTune source overlay
        run: python3 ps2-autotune/apply_autotune.py upstream

      - name: Give the fork its own Android identity
        shell: bash
        run: |
          printf '\n%s\n' \
            'armsx2.applicationId=com.artemkz147.ps2autotune' \
            'armsx2.versionName=1.0.0-autotune' \
            'armsx2.versionCode=147001' \
            >> upstream/platforms/android/gradle.properties

      - name: Record exact source
        shell: bash
        run: |
          mkdir -p dist
          {
            echo "PS2 AutoTune Android"
            echo "application_id=com.artemkz147.ps2autotune"
            echo "overlay_repo=${GITHUB_REPOSITORY}"
            echo "overlay_commit=${GITHUB_SHA}"
            echo "upstream_repo=ARMSX2/ARMSX2"
            echo "upstream_ref=${UPSTREAM_REF}"
            echo "upstream_commit=${UPSTREAM_SHA}"
            echo "license=GPL-3.0"
          } > dist/SOURCE-MANIFEST.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/platforms/android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Install Android 17 build dependencies
        shell: bash
        run: |
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
          test -x "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

      - name: Create installable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1
          fi

      - name: Fetch shader compiler dependencies
        working-directory: upstream/platforms/android
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build universal 4K + 16K APK
        working-directory: upstream/platforms/android
        run: ./tools/build-universal-page-apk.sh "$GITHUB_WORKSPACE/dist/PS2-AutoTune-Android-universal.apk"

      - name: Verify package and APK
        shell: bash
        run: |
          test -s dist/PS2-AutoTune-Android-universal.apk
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose dist/PS2-AutoTune-Android-universal.apk
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging dist/PS2-AutoTune-Android-universal.apk | head -n 5
          sha256sum dist/PS2-AutoTune-Android-universal.apk > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2-AutoTune-Android
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish test APK in Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete ps2-autotune-ci --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create ps2-autotune-ci \
            dist/PS2-AutoTune-Android-universal.apk \
            dist/SOURCE-MANIFEST.txt \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "PS2 AutoTune Android — test build" \
            --notes "Automatic Android test build from branch ps2-autotune-android. Based on ARMSX2 ${UPSTREAM_REF}; includes local device/game AutoTune. BIOS and game images are not included." \
            --prerelease
