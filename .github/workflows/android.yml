name: Android APK

on:
  push:
    branches:
      - umk3-hd-fan-remake
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-launch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CC0 prerendered fighter and stage sources
        run: bash tools/fetch_cc0_sources.sh | tee cc0-source-inventory.txt

      - name: Build CC0 visual contact sheets
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/make_cc0_contact_sheets.py

      - name: Export selected source samples for art review
        run: |
          mkdir -p cc0-selected
          cp .cc0-sources/singles/verlaine.gif cc0-selected/
          cp .cc0-sources/singles/female-ninja.gif cc0-selected/
          cp .cc0-sources/singles/ava-lee.gif cc0-selected/
          cp .cc0-sources/singles/tasen-defender.png cc0-selected/
          find .cc0-sources/mustermenschen -maxdepth 1 -type f \( \
            -iname '*Nick Adler*' -o -iname '*Danny Van Damage*' -o -iname '*Raf Boulder*' -o \
            -iname '*Byron Verlaine*' -o -iname '*Ava Lee*Thai*' -o -iname '*Tasen woman 1 Tasen*' -o \
            -iname '*Tasen woman 2 Tasen*' -o -iname '*Tasen man 1*' -o -iname '*Kelvin Zone*' -o \
            -iname '*Susa No Mikoto Tasen*' -o -iname '*Komato berserker*' \) -print0 | xargs -0 -I{} cp '{}' cc0-selected/ || true
          find cc0-selected -type f -printf '%s\t%f\n' | sort -nr | tee cc0-selected-files.txt
          test "$(find cc0-selected -type f | wc -l)" -ge 10

      - name: Generate real 48-frame HD asset pack
        run: |
          rm -rf web/assets
          python3 tools/build_real_assets_v4.py | tee real-assets-build.log
          test "$(find web/assets/fighters -name atlas.png | wc -l)" -ge 25
          test "$(find web/assets/fighters -name portrait.png | wc -l)" -ge 25
          test "$(find web/assets/stages -name '*.png' | wc -l)" -ge 16
          grep -q 'prerendered-48f-hd-v4-layered-stages' web/assets/build-report.json
          python3 - <<'PY'
          from PIL import Image
          import json
          from pathlib import Path
          r=json.loads(Path('web/assets/build-report.json').read_text())
          assert r['fighterFrame']==[360,480]
          assert r['fighterAtlas']==[2880,2880]
          assert len(r['fighters'])>=25 and len(r['stages'])>=16
          assert Image.open('web/assets/fighters/scorpion/atlas.png').size==(2880,2880)
          assert Image.open('web/assets/fighters/scorpion/portrait.png').size==(512,512)
          assert Image.open('web/assets/stages/subway.png').size==(1920,1080)
          print('REAL_PACK_BYTES',sum(p.stat().st_size for p in Path('web/assets').rglob('*') if p.is_file()))
          PY
          test "$(du -sb web/assets | cut -f1)" -gt 20000000

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify JavaScript and fighting loop
        run: |
          node --check web/boot-guard.js
          node --check web/umk3-data.js
          node --check web/version.js
          node --check web/hd-atlases.js
          node --check web/game.js
          node --check web/hd-renderer.js
          node --check web/raster-runtime.js
          node --check web/mobile-controls.js
          node tests/smoke.cjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Reject shell or old-art APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          bytes=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "APK_BYTES=$bytes"
          test "$bytes" -gt 10000000
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/assets/fighters/scorpion/atlas.png'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/assets/fighters/scorpion/portrait.png'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/assets/stages/subway.png'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/assets/build-report.json | grep -q 'prerendered-48f-hd-v4-layered-stages'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install, navigate by touch, and fight on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb logcat -c
            adb shell am force-stop com.raznoe147.umk3hd
            adb shell am start -W -n com.raznoe147.umk3hd/.MainActivity | tee emulator-start.txt
            adb shell pidof com.raznoe147.umk3hd
            adb shell dumpsys activity activities | grep -q 'mResumedActivity.*com.raznoe147.umk3hd'

            ready=0
            for i in $(seq 1 20); do
              adb logcat -d -s UMK3HD:I '*:S' > emulator-runtime.log
              if grep -q 'Runtime check: true' emulator-runtime.log; then ready=1; break; fi
              sleep 1
            done
            cat emulator-runtime.log
            test "$ready" -eq 1

            size=$(adb shell wm size | tail -1 | grep -oE '[0-9]+x[0-9]+' | tail -1)
            W=${size%x*}; H=${size#*x}
            if [ "$W" -lt "$H" ]; then T=$W; W=$H; H=$T; fi
            echo "TOUCH_SCREEN=${W}x${H}" | tee emulator-touch.txt

            adb shell input tap $((W*50/100)) $((H*55/100)); sleep 1
            # Select Scorpion: seventh portrait in the first row.
            adb shell input tap $((W*82/100)) $((H*25/100)); sleep 1
            adb shell input tap $((W*50/100)) $((H*55/100)); sleep 4
            adb shell input tap $((W*82/100)) $((H*48/100)); sleep 1
            adb shell input swipe $((W*12/100)) $((H*69/100)) $((W*18/100)) $((H*69/100)) 450; sleep 1

            adb logcat -d -s UMK3HD:V '*:S' | tee emulator-touch.log
            grep -q 'UMK3_STATE=select' emulator-touch.log
            grep -q 'UMK3_STATE=tower' emulator-touch.log
            grep -q 'UMK3_STATE=fight' emulator-touch.log
            if adb logcat -d -v brief | grep -q 'FATAL EXCEPTION'; then adb logcat -d -v brief; exit 1; fi
            adb exec-out screencap -p > emulator-fight.png
            test -s emulator-fight.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umk3-realart-review
          path: |
            cc0-source-inventory.txt
            cc0-selected-files.txt
            cc0-selected/
            cc0-previews/
            real-assets-build.log
            web/assets/build-report.json
            emulator-start.txt
            emulator-runtime.log
            emulator-touch.txt
            emulator-touch.log
            emulator-fight.png
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: umk3-prerendered-hd-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
