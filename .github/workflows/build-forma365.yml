name: Build Forma365 APK

on:
  push:
    branches:
      - forma365-android
    paths:
      - 'forma365/**'
      - '.github/workflows/build-forma365.yml'
  pull_request:
    paths:
      - 'forma365/**'
      - '.github/workflows/build-forma365.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: forma365

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app JavaScript
        run: node --check app/src/main/assets/enhancements.js
      - name: Decode stable signing key
        run: base64 -d keystore/forma365-release.jks.b64 > keystore/forma365-release.jks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forma365-APK-v1.1.1
          path: forma365/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
