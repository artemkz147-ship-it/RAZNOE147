name: Zoo Mosaic Android Release Base

on:
  push:
    branches:
      - dino-mosaic-android-fix
    paths:
      - 'dino_mosaic_android/**'
      - '.github/workflows/dino-mosaic-android.yml'
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build release APK
        working-directory: dino_mosaic_android
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release base
        run: |
          test -f dino_mosaic_android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -v 4 dino_mosaic_android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Prepare artifact
        run: |
          mkdir -p out/signing-kit/lib out/signing-kit/lib64
          cp dino_mosaic_android/app/build/outputs/apk/release/app-release-unsigned.apk out/ZooMosaic-base-release-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" out/signing-kit/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" out/signing-kit/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" out/signing-kit/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib64/libc++.so" out/signing-kit/lib64/libc++.so
          chmod +x out/signing-kit/zipalign out/signing-kit/apksigner

      - name: Upload release base
        uses: actions/upload-artifact@v4
        with:
          name: zoo-mosaic-release-base
          path: out/
          if-no-files-found: error
          retention-days: 7
