name: Dino Mosaic Android Build

on:
  push:
    branches:
      - dino-mosaic-android-fix
    paths:
      - 'dino_mosaic_android/**'
      - '.github/workflows/dino-mosaic-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Generate final signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore dino_mosaic_android/dino-final.keystore \
            -storetype JKS \
            -storepass android \
            -alias dino \
            -keypass android \
            -dname "CN=DinoMosaic,O=DinoMosaic,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build debug APK
        working-directory: dino_mosaic_android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify base APK
        run: |
          test -f dino_mosaic_android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs dino_mosaic_android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare artifact and signing kit
        run: |
          mkdir -p out/signing-kit/lib out/signing-kit/lib64
          cp dino_mosaic_android/app/build/outputs/apk/debug/app-debug.apk out/DinoMosaic-base-debug.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" out/signing-kit/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" out/signing-kit/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" out/signing-kit/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib64/libc++.so" out/signing-kit/lib64/libc++.so
          cp dino_mosaic_android/dino-final.keystore out/signing-kit/dino-final.keystore
          chmod +x out/signing-kit/zipalign out/signing-kit/apksigner

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dino-mosaic-base-and-signing-kit
          path: out/
          if-no-files-found: error
          retention-days: 7
