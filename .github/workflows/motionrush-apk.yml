name: Build Motion Rush APK

on:
  push:
    branches:
      - motionrush-build
      - motionrush-v0.4
    paths:
      - 'MotionRush/**'
      - '.github/workflows/motionrush-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check web game JavaScript
        run: |
          node --check MotionRush/android/app/src/main/assets/web/src/main.mjs
          node --check MotionRush/android/app/src/main/assets/web/src/game.mjs
          node --check MotionRush/android/app/src/main/assets/web/src/render.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests and build debug APK
        working-directory: MotionRush/android
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: motionrush-v0.3-debug-apk
          path: MotionRush/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
