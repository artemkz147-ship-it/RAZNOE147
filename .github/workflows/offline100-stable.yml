name: Build and launch-test Offline100 stable

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'offline100-stable/**'
      - '.github/workflows/offline100-stable.yml'
  workflow_dispatch:

jobs:
  launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.1.0' }
      - name: Restore v1.1 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline100-stable/app/src/main/assets
          cat offline100-stable/.payload/app.* | base64 -d | gzip -d > offline100-stable/app/src/main/assets/app.js
          cat offline100-stable/.payload/style.* | base64 -d | gzip -d > offline100-stable/app/src/main/assets/styles.css
          cat offline100-stable/.payload/index.* | base64 -d | gzip -d > offline100-stable/app/src/main/assets/index.html
          base64 -d < offline100-stable/.payload/v11-app.patch.gz.b64 | gzip -d > /tmp/v11-app.patch
          base64 -d < offline100-stable/.payload/v11-styles.patch.gz.b64 | gzip -d > /tmp/v11-styles.patch
          patch offline100-stable/app/src/main/assets/app.js < /tmp/v11-app.patch
          patch offline100-stable/app/src/main/assets/styles.css < /tmp/v11-styles.patch
          cp offline100-stable/static/manifest.webmanifest offline100-stable/app/src/main/assets/manifest.webmanifest
          cp offline100-stable/static/sw.js offline100-stable/app/src/main/assets/sw.js
          test $(wc -c < offline100-stable/app/src/main/assets/app.js) -eq 212277
          test $(wc -c < offline100-stable/app/src/main/assets/styles.css) -eq 74907
          test $(wc -c < offline100-stable/app/src/main/assets/index.html) -eq 12839
      - name: Build APK
        working-directory: offline100-stable
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: offline100-v1.1.1-stable-apk
          path: offline100-stable/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and diagnose real launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            adb logcat -c
            adb install -r offline100-stable/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop ru.offline100.games
            adb shell am start -W -n ru.offline100.games/.MainActivity
            sleep 5
            adb logcat -d > startup-logcat.txt
            adb exec-out screencap -p > startup.png 2>/dev/null || true
            PID=$(adb shell pidof ru.offline100.games | tr -d '\r')
            echo "APP_PID=$PID"
            echo '--- Offline100 lines ---'
            grep -E 'Offline100|FATAL EXCEPTION|AndroidRuntime|Process: ru.offline100.games' startup-logcat.txt | tail -n 160 || true
            if [ -z "$PID" ]; then
              echo 'PROCESS_DIED_AFTER_LAUNCH'
              exit 41
            fi
            if grep -E 'FATAL EXCEPTION|STARTUP_FAILED|WEBVIEW_RENDERER_GONE' startup-logcat.txt; then exit 42; fi
            grep 'Offline100.*PAGE_FINISHED' startup-logcat.txt || exit 43
            grep 'Offline100.*GAME_CARD_COUNT="100"' startup-logcat.txt || exit 44
            exit 0
      - name: Upload launch proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline100-v1.1.1-launch-proof
          path: |
            startup.png
            startup-logcat.txt
          if-no-files-found: warn
          retention-days: 7
