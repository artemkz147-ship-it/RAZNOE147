name: Build Alias APK
on:
  push:
    branches: [ 'alias-staging-20260829-1852' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          rm -f project.zip
          for f in payload/p* payload2/r*; do
            base64 -d "$f" >> project.zip
          done
          unzip -t project.zip
          unzip -qo project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AliasTop-1.0.32-noads-apk
          path: app/build/outputs/apk/debug/app-debug.apk
