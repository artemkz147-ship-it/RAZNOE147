name: Build Shadowvale Yandex

on:
  push:
    branches:
      - yandex-3d-survival-fantasy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final source polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text(encoding='utf-8')
          first="      if (!fallback && n.includes('hand')) fallback = o;"
          first_new="      if (!right && (n.includes('palm.r') || n.includes('palm_r') || n.includes('palm r'))) right = o;\n      if (!fallback && (n.includes('hand') || n.includes('palm'))) fallback = o;"
          second="      if (!right && n.includes('hand') && (n.includes('right') || n.includes('.r') || n.includes('_r') || n.endsWith('r'))) right = o;"
          second_new="      if (!right && (n.includes('hand') || n.includes('palm')) && (n.includes('right') || n.includes('.r') || n.includes('_r') || n.endsWith('r'))) right = o;"
          if first in s: s=s.replace(first,first_new)
          if second in s: s=s.replace(second,second_new)
          material_anchor="        else if (o.material) o.material = o.material.clone();"
          material_code="        else if (o.material) o.material = o.material.clone();\n        const mats=Array.isArray(o.material)?o.material:[o.material];\n        for(const m of mats){const n=(m?.name||'').toLowerCase();if(m?.color&&n==='armor'){m.color.setHex(0x60747d);m.roughness=.72;m.metalness=.08;}if(m?.color&&n==='boots')m.color.setHex(0x563425);if(m?.color&&n==='skin')m.color.setHex(0xc8925f);}"
          if material_anchor in s and "m.color.setHex(0x60747d)" not in s: s=s.replace(material_anchor,material_code)
          sword_old="      bone.add(sword); sword.position.set(.03,.02,-.03); sword.rotation.set(Math.PI/2,0,0); sword.scale.setScalar(.88);"
          sword_new="      if (sword.children[0]) sword.children[0].position.set(0,0,0);\n      bone.add(sword); sword.position.set(0,0,0); sword.rotation.set(0,0,0); sword.scale.setScalar(.82);"
          if sword_old in s: s=s.replace(sword_old,sword_new)
          fixed_anchor="    const sword = this.prepareAttachment(this.assets.sword, .92);"
          fixed_code="    const sword = this.prepareAttachment(this.assets.sword, .92);\n    if (sword.children[0]) sword.children[0].position.set(0,0,0);\n    characterRoot.add(sword); sword.position.set(-.40,.95,.43); sword.rotation.set(0,0,Math.PI); sword.scale.setScalar(1.05); characterRoot.userData.weapon=sword; return sword;"
          if fixed_anchor in s and "characterRoot.userData.weapon=sword; return sword;" not in s: s=s.replace(fixed_anchor,fixed_code)
          s=s.replace("sword.position.set(-.62,1.08,.08)","sword.position.set(-.40,.95,.43)")
          menu_find="const idle=this.findClip(this.assets.hero,['idle']);"
          if menu_find in s: s=s.replace(menu_find,"const idle=this.findClip(this.assets.hero,['idle_weaponright','idle']);")
          map_old="const map={ idle:['idle'], run:['run_swordright','run','walk'], attack:['swordattack','attack','slash','hit'], death:['death','die'] };"
          map_new="const map={ idle:['idle_weaponright','idle'], run:['run_weaponright','run','walk'], attack:['run_swordattack','swordattackjump','attack','hit'], death:['death','die'] };"
          if map_old in s: s=s.replace(map_old,map_new)
          menu_old="this.menuHero.action=this.menuHero.mixer.clipAction(idle);this.menuHero.action.play();}"
          menu_new="this.menuHero.action=this.menuHero.mixer.clipAction(idle);this.menuHero.action.play();this.menuHero.action.time=.55;this.menuHero.mixer.update(0);}"
          if menu_old in s: s=s.replace(menu_old,menu_new)
          player_old="this.scene.add(this.player.root); this.attachSword(this.player.root); this.player.mixer=new THREE.AnimationMixer(this.player.root); this.playPlayerAnim('idle',true,.12);"
          player_new="this.scene.add(this.player.root); this.attachSword(this.player.root); this.player.mixer=new THREE.AnimationMixer(this.player.root); this.playPlayerAnim('idle',true,.12); if(this.player.action){this.player.action.time=.55;this.player.mixer.update(0);}"
          if player_old in s: s=s.replace(player_old,player_new)
          ground_old="    const b = new THREE.Box3().setFromObject(model); model.position.y -= b.min.y;\n    model.traverse(o => { if(o.isMesh){o.receiveShadow=true;o.castShadow=false;} });"
          ground_new="    const b = new THREE.Box3().setFromObject(model); model.position.y -= b.max.y;\n    model.traverse(o => { if(o.isMesh){o.receiveShadow=true;o.castShadow=false;} });"
          if ground_old in s: s=s.replace(ground_old,ground_new)
          attack_anchor="this.playPlayerAnim('attack',false,.05);this.audio.attack();"
          attack_code="this.playPlayerAnim('attack',false,.05);this.audio.attack();const weapon=p.root.userData.weapon;if(weapon){weapon.rotation.z=2.2;clearTimeout(p.weaponTimer);p.weaponTimer=setTimeout(()=>{if(weapon.parent)weapon.rotation.z=Math.PI;},Math.min(260,p.attackDelay*390));}"
          if attack_anchor in s and "const weapon=p.root.userData.weapon" not in s: s=s.replace(attack_anchor,attack_code)
          required=["idle_weaponright","run_weaponright","run_swordattack","sword.position.set(-.40,.95,.43)","model.position.y -= b.max.y","const weapon=p.root.userData.weapon"]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Final armed animation polish missing: '+', '.join(missing))
          p.write_text(s,encoding='utf-8')
          PY
          node --check src/main.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Blender and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy zip unzip
          blender --version | head -1
          blender -b --factory-startup --python-expr "import numpy; print('Blender numpy', numpy.__version__)"

      - name: Build CC0 GLB assets
        run: bash tools/build_assets.sh .asset-src

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build production game
        run: npm run build

      - name: Validate Yandex Games package
        run: python3 tools/validate_build.py

      - name: Browser WebGL visual smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/shadowvale-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          TEST_URL='http://127.0.0.1:4173/?autostart=1&debug-fast=1'
          CHROME_FLAGS='--headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader --use-angle=swiftshader --autoplay-policy=no-user-gesture-required'
          "$CHROME" $CHROME_FLAGS --window-size=1280,720 --virtual-time-budget=8000 --dump-dom "$TEST_URL" > /tmp/shadowvale-dom.html || true
          grep -q 'data-game-ready="true"' /tmp/shadowvale-dom.html
          grep -Eq 'data-game-state="(playing|upgrade|gameover|victory)"' /tmp/shadowvale-dom.html
          "$CHROME" $CHROME_FLAGS --window-size=1280,720 --virtual-time-budget=5500 --screenshot=smoke-desktop.png "$TEST_URL"
          "$CHROME" $CHROME_FLAGS --window-size=412,915 --virtual-time-budget=5500 --screenshot=smoke-mobile.png --user-agent='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36' "$TEST_URL"
          test -s smoke-desktop.png
          test -s smoke-mobile.png

      - name: Commit source polish
        shell: bash
        run: |
          if git diff --quiet -- src/main.js; then
            echo 'Source already contains final armed animation polish.'
          else
            git config user.name 'Shadowvale Release Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add src/main.js
            git commit -m 'Use authored armed animation set for Knight'
            git push origin HEAD:yandex-3d-survival-fantasy
          fi

      - name: Create Yandex upload archive
        run: |
          cd dist
          zip -9 -r ../shadowvale-survivor-yandex-v1.0.0.zip .
          cd ..
          unzip -t shadowvale-survivor-yandex-v1.0.0.zip
          ls -lh shadowvale-survivor-yandex-v1.0.0.zip

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: shadowvale-survivor-yandex-v1.0.0
          path: shadowvale-survivor-yandex-v1.0.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: shadowvale-smoke-screens
          path: |
            smoke-desktop.png
            smoke-mobile.png
          if-no-files-found: error
          retention-days: 14
