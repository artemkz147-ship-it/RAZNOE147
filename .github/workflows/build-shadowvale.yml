name: Build Shadowvale Yandex

on:
  push:
    branches:
      - yandex-3d-survival-fantasy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Blender and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy zip unzip
          blender --version | head -1
          blender -b --factory-startup --python-expr "import numpy; print('Blender numpy', numpy.__version__)"

      - name: Build CC0 GLB assets
        run: bash tools/build_assets.sh .asset-src

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build production game
        run: npm run build

      - name: Validate Yandex Games package
        run: python3 tools/validate_build.py

      - name: Create Yandex upload archive
        run: |
          cd dist
          zip -9 -r ../shadowvale-survivor-yandex.zip .
          cd ..
          ls -lh shadowvale-survivor-yandex.zip

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: shadowvale-survivor-yandex
          path: shadowvale-survivor-yandex.zip
          if-no-files-found: error
          retention-days: 30
