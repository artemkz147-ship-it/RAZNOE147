name: Remove duplicate PS2 Actions artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-final-ps2-artifact.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete duplicate artifact
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: 9100662865
            });
            core.info('Deleted duplicate PS2 Actions artifact; release copy remains.');
