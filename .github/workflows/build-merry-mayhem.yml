name: Build Merry Mayhem 3D Yandex

on:
  push:
    branches: [yandex-3d-merry-mayhem]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize full 3D project
        shell: bash
        run: |
          echo materialize > /tmp/merry-stage
          set -euo pipefail
          cat .build/payload.part* | tr -d '\r\n' | base64 -d > /tmp/merry-payload.tgz
          tar -tzf /tmp/merry-payload.tgz >/dev/null
          tar -xzf /tmp/merry-payload.tgz
          chmod +x tools/build_assets.sh
          python3 tools/post_materialize_fixes.py
          python3 tools/fix_animation_checker.py
          python3 tools/expand_progression.py
          python3 tools/visual_polish.py
          python3 tools/terrain_polish.py
          python3 tools/final_qa_fixes.py
          python3 .build/pro_overhaul.py
          python3 .build/pro_finish.py
          python3 .build/v3_top_overhaul.py
          python3 .build/v3_release_fix.py
          node --check src/content.js
          node --check src/main.js
          node --check src/yandex.js
          python3 -m py_compile tools/render_portraits.py tools/validate_build.py .build/v3_release_fix.py
          git config user.name 'Merry Mayhem Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/content.js src/main.js src/style.css src/yandex.js tools/build_assets.sh tools/check_glb_animations.py tools/validate_build.py
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize Merry Mayhem 3D v3 release art'
            git push origin HEAD:yandex-3d-merry-mayhem
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Blender and build tools
        run: |
          echo blender > /tmp/merry-stage
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy zip unzip xvfb xauth libegl1 libgl1 libgl1-mesa-dri libgles2
          blender --version | head -1
          blender -b --factory-startup --python-expr "import numpy; print('Blender numpy', numpy.__version__)"
          xvfb-run -a blender -b --factory-startup --python-expr "print('Headless portrait context ready')"

      - name: Build CC0 GLB library and portraits
        run: |
          echo assets > /tmp/merry-stage
          bash tools/build_assets.sh .asset-src
          test "$(find public/assets -name '*.glb' | wc -l)" -ge 90
          test "$(find public/portraits -name '*.png' | wc -l)" -eq 30

      - name: Install dependencies
        run: |
          echo npm > /tmp/merry-stage
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund puppeteer-core@24

      - name: Production build
        run: |
          echo vite > /tmp/merry-stage
          npm run build

      - name: Validate content and Yandex package
        shell: bash
        run: |
          echo validate > /tmp/merry-stage
          set -euo pipefail
          python3 tools/validate_build.py
          python3 - <<'PY'
          from pathlib import Path
          main=Path('src/main.js').read_text(encoding='utf-8')
          content=Path('src/content.js').read_text(encoding='utf-8')
          build=Path('tools/build_assets.sh').read_text(encoding='utf-8')
          checks={
            'debug map selector':'const DEBUG_MAP' in main,
            'debug hero selector':'const DEBUG_HERO' in main,
            'v3 authored set pieces':'buildV3SetPieces' in main,
            'hero portrait UI':'heroPortrait' in main,
            'weapon portrait UI':'weaponPortrait' in main,
            'held weapon profiles':'HELD_PROFILES' in content,
            'thematic bow weapon':"model:'weapon09'" in content,
            'real shots telemetry':'qaShots' in main,
            'real hits telemetry':'qaHits' in main,
            'real kills telemetry':'qaKills' in main,
            'legacy CC0 RPG staff pack':'RPG%20Pack.zip' in build,
            'headless portrait render':'xvfb-run -a blender' in build,
            'no modern gun download':'ultimate_gun_pack' not in build and '$ROOT/guns' not in build,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('V3 source contract failed: '+', '.join(failed))
          glb=list(Path('dist/assets').glob('*.glb'))
          hp=list(Path('dist/portraits').glob('hero-*.png'))
          wp=list(Path('dist/portraits').glob('weapon-*.png'))
          if len(glb)<90: raise SystemExit(f'Expected >=90 GLB, got {len(glb)}')
          if len(hp)!=15 or len(wp)!=15: raise SystemExit(f'Portrait count wrong: heroes={len(hp)} weapons={len(wp)}')
          print(f'V3 release contract passed: {len(glb)} GLB, {len(hp)} hero portraits, {len(wp)} weapon portraits')
          PY

      - name: Real-time WebGL combat and visual QA
        shell: bash
        run: |
          echo webgl > /tmp/merry-stage
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/merry-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          CHROME="$CHROME" node .build/browser_qa.mjs
          for f in qa-heroes.png qa-sunny-meadow.png qa-candy-park.png qa-snow-festival.png qa-rainbow-canyon.png qa-firefly-swamp.png qa-mobile-festival.png; do test -s "$f"; done

      - name: Package releases
        shell: bash
        run: |
          echo package > /tmp/merry-stage
          cd dist
          zip -9 -r ../vesely-natisk-3d-yandex-v3.0.0.zip .
          cd ..
          unzip -t vesely-natisk-3d-yandex-v3.0.0.zip >/dev/null
          test "$(unzip -Z1 vesely-natisk-3d-yandex-v3.0.0.zip | grep -c '^index\.html$')" -eq 1
          zip -9 -r vesely-natisk-3d-full-project-v3.0.0.zip index.html package.json vite.config.js README.md docs src tools public .github/workflows/build-merry-mayhem.yml .build/pro_overhaul.py .build/pro_finish.py .build/v3_top_overhaul.py .build/v3_release_fix.py .build/browser_qa.mjs -x '*.DS_Store'
          unzip -t vesely-natisk-3d-full-project-v3.0.0.zip >/dev/null
          rm -rf local-test && mkdir local-test
          cp -a dist/. local-test/
          cat > local-test/START_LOCAL.ps1 <<'POWERSHELL'
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $port = 8765
          $listener = [System.Net.HttpListener]::new()
          $listener.Prefixes.Add("http://127.0.0.1:$port/")
          $listener.Start()
          Start-Process "http://127.0.0.1:$port/"
          Write-Host "Весёлый Натиск 3D v3: http://127.0.0.1:$port/"
          Write-Host "Для остановки закройте это окно."
          $mime = @{'.html'='text/html; charset=utf-8';'.js'='text/javascript; charset=utf-8';'.css'='text/css; charset=utf-8';'.glb'='model/gltf-binary';'.json'='application/json';'.png'='image/png';'.jpg'='image/jpeg';'.svg'='image/svg+xml'}
          while ($listener.IsListening) {
            $ctx = $listener.GetContext(); $rel = [Uri]::UnescapeDataString($ctx.Request.Url.AbsolutePath.TrimStart('/'))
            if ([string]::IsNullOrWhiteSpace($rel)) {$rel='index.html'}
            $path = Join-Path $root $rel
            if (-not (Test-Path $path -PathType Leaf)) {$ctx.Response.StatusCode=404; $ctx.Response.Close(); continue}
            $ext=[IO.Path]::GetExtension($path).ToLower(); if($mime.ContainsKey($ext)){$ctx.Response.ContentType=$mime[$ext]}
            $bytes=[IO.File]::ReadAllBytes($path); $ctx.Response.ContentLength64=$bytes.Length; $ctx.Response.OutputStream.Write($bytes,0,$bytes.Length); $ctx.Response.Close()
          }
          POWERSHELL
          cat > local-test/START_LOCAL.bat <<'BAT'
          @echo off
          cd /d "%~dp0"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0START_LOCAL.ps1"
          BAT
          cat > local-test/README_LOCAL.txt <<'TXT'
          ЛОКАЛЬНЫЙ ЗАПУСК
          1. Распакуйте архив полностью.
          2. Запустите START_LOCAL.bat.
          3. Игра откроется в браузере автоматически.
          Не открывайте index.html двойным кликом: WebGL-модули и ассеты должны загружаться через локальный HTTP-сервер.
          TXT
          cd local-test && zip -9 -r ../vesely-natisk-3d-local-test-v3.0.0.zip . && cd ..
          unzip -t vesely-natisk-3d-local-test-v3.0.0.zip >/dev/null
          ls -lh vesely-natisk-3d-*.zip

      - name: Upload Yandex build
        uses: actions/upload-artifact@v4
        with:
          name: vesely-natisk-3d-yandex-v3.0.0
          path: vesely-natisk-3d-yandex-v3.0.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: vesely-natisk-3d-full-project-v3.0.0
          path: vesely-natisk-3d-full-project-v3.0.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload local tester
        uses: actions/upload-artifact@v4
        with:
          name: vesely-natisk-3d-local-test-v3.0.0
          path: vesely-natisk-3d-local-test-v3.0.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: merry-mayhem-3d-qa-v3.0
          path: |
            qa-heroes.png
            qa-sunny-meadow.png
            qa-candy-park.png
            qa-snow-festival.png
            qa-rainbow-canyon.png
            qa-firefly-swamp.png
            qa-mobile-festival.png
          if-no-files-found: error
          retention-days: 30

      - name: Record observable build result
        if: always()
        shell: bash
        run: |
          STAGE="$(cat /tmp/merry-stage 2>/dev/null || echo checkout)"
          mkdir -p .build
          printf '{"status":"%s","stage":"%s","run_id":"%s","sha":"%s"}\n' '${{ job.status }}' "$STAGE" '${{ github.run_id }}' '${{ github.sha }}' > .build/status.json
          git config user.name 'Merry Mayhem Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .build/status.json
          git commit -m "Build status: ${{ job.status }} at $STAGE" || true
          git push origin HEAD:yandex-3d-merry-mayhem || true
