name: Build Merry Mayhem 3D Yandex

on:
  push:
    branches: [yandex-3d-merry-mayhem]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize full 3D project
        shell: bash
        run: |
          echo materialize > /tmp/merry-stage
          set -euo pipefail
          cat .build/payload.part* | tr -d '\r\n' | base64 -d > /tmp/merry-payload.tgz
          tar -tzf /tmp/merry-payload.tgz >/dev/null
          tar -xzf /tmp/merry-payload.tgz
          chmod +x tools/build_assets.sh
          python3 tools/post_materialize_fixes.py
          python3 tools/fix_animation_checker.py
          python3 tools/expand_progression.py
          python3 tools/visual_polish.py
          python3 tools/terrain_polish.py
          python3 tools/final_qa_fixes.py
          python3 .build/pro_overhaul.py
          python3 .build/pro_finish.py
          node --check src/content.js
          node --check src/main.js
          node --check src/yandex.js
          git config user.name 'Merry Mayhem Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/content.js src/main.js src/style.css src/yandex.js tools/build_assets.sh tools/check_glb_animations.py tools/validate_build.py
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize final Merry Mayhem 3D gameplay'
            git push origin HEAD:yandex-3d-merry-mayhem
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Blender and build tools
        run: |
          echo blender > /tmp/merry-stage
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy zip unzip
          blender --version | head -1
          blender -b --factory-startup --python-expr "import numpy; print('Blender numpy', numpy.__version__)"

      - name: Build CC0 GLB library
        run: |
          echo assets > /tmp/merry-stage
          bash tools/build_assets.sh .asset-src

      - name: Install dependencies
        run: |
          echo npm > /tmp/merry-stage
          npm install --no-audit --no-fund

      - name: Production build
        run: |
          echo vite > /tmp/merry-stage
          npm run build

      - name: Validate content and Yandex package
        run: |
          echo validate > /tmp/merry-stage
          python3 tools/validate_build.py
          test "$(find dist/assets -name '*.glb' | wc -l)" -ge 77
          grep -q "const DEBUG_MAP" src/main.js
          grep -q "const DEBUG_HERO" src/main.js
          grep -q "grassShort" src/content.js
          grep -q "pineSnow" src/content.js
          grep -q "cactus" src/content.js
          grep -q "willow" src/content.js
          grep -q "buildMacroClusters" src/main.js
          grep -q "HELD_PROFILES" src/content.js
          grep -q "bow.glb" src/content.js
          grep -q "qaKills" src/main.js
          grep -q "qaHits" src/main.js
          grep -q "qaShots" src/main.js

      - name: WebGL QA across contrasting maps
        shell: bash
        run: |
          echo webgl > /tmp/merry-stage
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/merry-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          FLAGS='--headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader --use-angle=swiftshader --autoplay-policy=no-user-gesture-required'
          COMBAT='http://127.0.0.1:4173/?autostart=1&debug-fast=1&map=sunny_meadow&hero=donut_knight'
          BASE='http://127.0.0.1:4173/?autostart=1'
          "$CHROME" $FLAGS --window-size=1280,720 --virtual-time-budget=16000 --dump-dom "$COMBAT" >/tmp/merry-dom.html || true
          grep -oE 'data-(game-ready|game-state|qa-shots|qa-hits|qa-kills)="[^"]*"' /tmp/merry-dom.html || true
          grep -q 'data-game-ready="true"' /tmp/merry-dom.html
          grep -Eq 'data-game-state="(playing|upgrade|gameover|victory)"' /tmp/merry-dom.html
          grep -Eq 'data-qa-shots="[1-9][0-9]*"' /tmp/merry-dom.html
          grep -Eq 'data-qa-hits="[1-9][0-9]*"' /tmp/merry-dom.html
          grep -Eq 'data-qa-kills="[1-9][0-9]*"' /tmp/merry-dom.html
          for SPEC in 'sunny-meadow sunny_meadow donut_knight' 'candy-park candy_park candy_witch' 'snow-festival snow_festival snow_penguin' 'rainbow-canyon rainbow_canyon fox_archer' 'firefly-swamp firefly_swamp lightning_bee'; do
            set -- $SPEC; NAME=$1; MAP=$2; HERO=$3
            "$CHROME" $FLAGS --window-size=1280,720 --virtual-time-budget=9000 --screenshot="qa-$NAME.png" "$BASE&map=$MAP&hero=$HERO"
            test -s "qa-$NAME.png"
          done
          "$CHROME" $FLAGS --window-size=412,915 --virtual-time-budget=9000 --screenshot=qa-mobile-festival.png --user-agent='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36' "$BASE&map=festival_finale&hero=pumpkin_jester"
          test -s qa-mobile-festival.png

      - name: Package releases
        shell: bash
        run: |
          echo package > /tmp/merry-stage
          cd dist
          zip -9 -r ../vesely-natisk-3d-yandex-v2.1.0.zip .
          cd ..
          unzip -t vesely-natisk-3d-yandex-v2.1.0.zip >/dev/null
          test "$(unzip -Z1 vesely-natisk-3d-yandex-v2.1.0.zip | grep -c '^index\.html$')" -eq 1
          zip -9 -r vesely-natisk-3d-full-project-v2.1.0.zip index.html package.json vite.config.js README.md src tools public .github/workflows/build-merry-mayhem.yml -x '*.DS_Store'
          unzip -t vesely-natisk-3d-full-project-v2.1.0.zip >/dev/null
          rm -rf local-test && mkdir local-test
          cp -a dist/. local-test/
          cat > local-test/START_LOCAL.ps1 <<'POWERSHELL'
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $port = 8765
          $listener = [System.Net.HttpListener]::new()
          $listener.Prefixes.Add("http://127.0.0.1:$port/")
          $listener.Start()
          Start-Process "http://127.0.0.1:$port/"
          Write-Host "Весёлый Натиск 3D: http://127.0.0.1:$port/"
          Write-Host "Для остановки закройте это окно."
          $mime = @{'.html'='text/html; charset=utf-8';'.js'='text/javascript; charset=utf-8';'.css'='text/css; charset=utf-8';'.glb'='model/gltf-binary';'.json'='application/json';'.png'='image/png';'.jpg'='image/jpeg';'.svg'='image/svg+xml'}
          while ($listener.IsListening) {
            $ctx = $listener.GetContext(); $rel = [Uri]::UnescapeDataString($ctx.Request.Url.AbsolutePath.TrimStart('/'))
            if ([string]::IsNullOrWhiteSpace($rel)) {$rel='index.html'}
            $path = Join-Path $root $rel
            if (-not (Test-Path $path -PathType Leaf)) {$ctx.Response.StatusCode=404; $ctx.Response.Close(); continue}
            $ext=[IO.Path]::GetExtension($path).ToLower(); if($mime.ContainsKey($ext)){$ctx.Response.ContentType=$mime[$ext]}
            $bytes=[IO.File]::ReadAllBytes($path); $ctx.Response.ContentLength64=$bytes.Length; $ctx.Response.OutputStream.Write($bytes,0,$bytes.Length); $ctx.Response.Close()
          }
          POWERSHELL
          cat > local-test/START_LOCAL.bat <<'BAT'
          @echo off
          cd /d "%~dp0"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0START_LOCAL.ps1"
          BAT
          cat > local-test/README_LOCAL.txt <<'TXT'
          ЛОКАЛЬНЫЙ ЗАПУСК
          1. Распакуйте архив полностью.
          2. Запустите START_LOCAL.bat.
          3. Игра откроется в браузере автоматически.
          Не открывайте index.html двойным кликом: WebGL-модули и ассеты должны загружаться через локальный HTTP-сервер.
          TXT
          cd local-test && zip -9 -r ../vesely-natisk-3d-local-test-v2.1.0.zip . && cd ..
          unzip -t vesely-natisk-3d-local-test-v2.1.0.zip >/dev/null
          ls -lh vesely-natisk-3d-*.zip

      - name: Upload Yandex build
        uses: actions/upload-artifact@v4
        with:
          name: vesely-natisk-3d-yandex-v2.1.0
          path: vesely-natisk-3d-yandex-v2.1.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: vesely-natisk-3d-full-project-v2.1.0
          path: vesely-natisk-3d-full-project-v2.1.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload local tester
        uses: actions/upload-artifact@v4
        with:
          name: vesely-natisk-3d-local-test-v2.1.0
          path: vesely-natisk-3d-local-test-v2.1.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: merry-mayhem-3d-qa-v2.1
          path: |
            qa-sunny-meadow.png
            qa-candy-park.png
            qa-snow-festival.png
            qa-rainbow-canyon.png
            qa-firefly-swamp.png
            qa-mobile-festival.png
          if-no-files-found: error
          retention-days: 30

      - name: Record observable build result
        if: always()
        shell: bash
        run: |
          STAGE="$(cat /tmp/merry-stage 2>/dev/null || echo checkout)"
          mkdir -p .build
          printf '{"status":"%s","stage":"%s","run_id":"%s","sha":"%s"}\n' '${{ job.status }}' "$STAGE" '${{ github.run_id }}' '${{ github.sha }}' > .build/status.json
          git config user.name 'Merry Mayhem Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .build/status.json
          git commit -m "Build status: ${{ job.status }} at $STAGE" || true
          git push origin HEAD:yandex-3d-merry-mayhem || true
