name: Build Alias APK

on:
  push:
    branches:
      - alias-apk-final-20260829

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          cat payload_final/c* | base64 -d > project.zip
          echo "557e7194ed26c08dc329006bb46168b4400e7c2e052eb4f61b214292e92f8a25  project.zip" | sha256sum -c -
          unzip -t project.zip
          unzip -qo project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alias-1.0.32-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
