name: Build Sky Frontiers Reference UI V8

on:
  push:
    branches:
      - sky-reference-ui-v8
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and patch game
        run: |
          set -euo pipefail
          cat skyfrontiers3d_src.part* | base64 -d > skyfrontiers3d-src.zip
          unzip -q skyfrontiers3d-src.zip
          python sky_quality_patch.py
          python sky_real_aircraft_patch.py
          python sky_video_fix_patch.py
          python sky_video_v4_hotfix.py
          python sky_ui_v7_patch.py
          python sky_reference_v8_patch.py
          node --check skyfrontiers3d/game.js
          grep -q 'rel="stylesheet" href="./style.css"' skyfrontiers3d/index.html
          grep -q 'startDeck' skyfrontiers3d/index.html
          grep -q 'throttle-unit' skyfrontiers3d/style.css
          grep -q 'round-gauge' skyfrontiers3d/style.css
          grep -q "k.has('KeyB')" skyfrontiers3d/game.js
          ! grep -q 'bottom-dock' skyfrontiers3d/style.css
          ! grep -q 'spawnEmergencyPlaceholder' skyfrontiers3d/game.js
          ! grep -q 'ridgesafe' skyfrontiers3d/game.js
          grep -q 'Cessna 172P' skyfrontiers3d/game.js
          grep -q 'gyroEnabled:false' skyfrontiers3d/game.js

      - name: Build authored carrier
        run: |
          python -m pip install --quiet trimesh numpy matplotlib
          python make_carrier.py skyfrontiers3d/public/env/carrier_hd.glb

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Assimp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq assimp-utils

      - name: Fetch detailed simulator aircraft
        shell: python
        run: |
          import re, pathlib, posixpath, urllib.parse, urllib.request
          MODELS=[
            ('c172p-team/c172p','master','Models/c172-common.ac','/tmp/fg-c172'),
            ('mbuse/Flightgear_777','master','Models/777-200ER.ac','/tmp/fg-777'),
            ('NikolaiVChr/f16','master','Models/F-16D.ac','/tmp/fg-f16'),
          ]
          def dl(url,path):
            path=pathlib.Path(path); path.parent.mkdir(parents=True,exist_ok=True)
            with urllib.request.urlopen(url,timeout=90) as r:path.write_bytes(r.read())
          for repo,branch,ac_path,root in MODELS:
            root=pathlib.Path(root);base=f'https://raw.githubusercontent.com/{repo}/{branch}/'
            local=root/ac_path;dl(base+urllib.parse.quote(ac_path,safe='/'),local)
            text=local.read_text(errors='ignore')
            refs=sorted(set(re.findall(r'(?im)^\s*texture\s+"([^"]+)"',text)))
            for ref in refs:
              ref=ref.replace('\\','/');remote=posixpath.normpath(posixpath.join(posixpath.dirname(ac_path),ref))
              if remote.startswith('../'):continue
              try:dl(base+urllib.parse.quote(remote,safe='/'),root/remote)
              except Exception as e:print('optional texture missing',remote,e)

      - name: Convert detailed aircraft to GLB2
        working-directory: skyfrontiers3d
        run: |
          set -euo pipefail
          mkdir -p public/models
          assimp export /tmp/fg-c172/Models/c172-common.ac public/models/c172_fg.glb -f glb2
          assimp export /tmp/fg-777/Models/777-200ER.ac public/models/b777_fg.glb -f glb2
          assimp export /tmp/fg-f16/Models/F-16D.ac public/models/f16_fg.glb -f glb2
          test $(stat -c%s public/models/c172_fg.glb) -gt 500000
          test $(stat -c%s public/models/b777_fg.glb) -gt 500000
          test $(stat -c%s public/models/f16_fg.glb) -gt 300000

      - name: Download HD environment
        working-directory: skyfrontiers3d
        run: |
          set -euxo pipefail
          mkdir -p public/env public/quality
          BASE=https://raw.githubusercontent.com/anshaneja5/skyline-run/main/public/assets/models
          for f in b_small.glb b_medium.glb b_large.glb tree1.glb tree2.glb tree3.glb bush.glb; do curl -fL --retry 3 -o public/env/$f $BASE/$f; done
          P=https://dl.polyhaven.org/file/ph-assets/Textures/png/1k
          for a in aerial_grass_rock aerial_asphalt_01 dirt_aerial_02 rock_ground_02; do
            curl -fL --retry 3 -o public/quality/${a}_diff_1k.png $P/$a/${a}_diff_1k.png
            curl -fL --retry 3 -o public/quality/${a}_nor_gl_1k.png $P/$a/${a}_nor_gl_1k.png
            curl -fL --retry 3 -o public/quality/${a}_rough_1k.png $P/$a/${a}_rough_1k.png
          done
          curl -fL --retry 3 -o public/quality/waternormals.jpg https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/textures/waternormals.jpg
          curl -fL --retry 3 -o public/quality/sky.hdr https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/rural_asphalt_road_1k.hdr || curl -fL --retry 3 -o public/quality/sky.hdr https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/sunset_jhbcentral_1k.hdr

      - name: Build web runtime
        working-directory: skyfrontiers3d
        run: |
          npm install --no-audit --no-fund
          npm run build
          for f in c172_fg b777_fg f16_fg; do test -s dist/models/$f.glb; done
          grep -q 'style.css' dist/index.html
          grep -R -q 'throttle-unit' dist/assets dist/index.html
          ! grep -R -q 'spawnEmergencyPlaceholder' dist/assets

      - name: Copy web build into Android
        working-directory: skyfrontiers3d
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: skyfrontiers3d/android
        run: gradle --no-daemon assembleDebug

      - name: Verify final APK content
        working-directory: skyfrontiers3d/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          for f in c172_fg b777_fg f16_fg; do unzip -l "$APK" | grep -q "assets/www/models/$f.glb"; done
          unzip -l "$APK" | grep -q 'assets/www/quality/sky.hdr'
          unzip -p "$APK" assets/www/index.html | grep -q 'style.css'
          unzip -p "$APK" assets/www/index.html | grep -q 'startDeck'
          CSS=$(unzip -Z1 "$APK" | grep '^assets/www/assets/.*\.css$' | head -1)
          test -n "$CSS"
          unzip -p "$APK" "$CSS" | grep -q 'throttle-unit'
          SIZE=$(stat -c%s "$APK"); echo "APK bytes: $SIZE"; test "$SIZE" -ge 18000000
          cp "$APK" ../../Sky-Frontiers-3D-REFERENCE-V8.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sky-Frontiers-3D-REFERENCE-V8-apk
          path: Sky-Frontiers-3D-REFERENCE-V8.apk
          if-no-files-found: error
