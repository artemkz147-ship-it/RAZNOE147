name: Build MyShifts APK

on:
  push:
    branches: [main]
    paths:
      - 'myshifts_build/source.part*'
      - '.github/workflows/myshifts-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        run: |
          cat myshifts_build/source.part00 myshifts_build/source.part01 myshifts_build/source.part02 myshifts_build/source.part03 > myshifts_build/source.b64
          base64 --decode myshifts_build/source.b64 > MyShiftsPro-source.zip
          unzip -tq MyShiftsPro-source.zip
          unzip -q -o MyShiftsPro-source.zip
          sed -i '/org.jetbrains.kotlin.android/d' MyShiftsPro/app/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2026.04.01/' MyShiftsPro/app/build.gradle.kts
          sed -i 's/androidx.core:core-ktx:1.19.1/androidx.core:core-ktx:1.17.0/' MyShiftsPro/app/build.gradle.kts
          sed -i 's/androidx.compose.material.icons.filled.HomeRounded/androidx.compose.material.icons.filled.Home/' MyShiftsPro/app/src/main/java/ru/myshifts/app/MainActivity.kt
          sed -i 's/Icons.Default.HomeRounded/Icons.Default.Home/g' MyShiftsPro/app/src/main/java/ru/myshifts/app/MainActivity.kt
          cat > MyShiftsPro/app/src/main/java/ru/myshifts/app/ShiftWidget.kt <<'KOT'
          package ru.myshifts.app

          import android.content.Context
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.unit.dp
          import androidx.glance.Button
          import androidx.glance.GlanceId
          import androidx.glance.GlanceModifier
          import androidx.glance.LocalContext
          import androidx.glance.action.actionStartActivity
          import androidx.glance.appwidget.GlanceAppWidget
          import androidx.glance.appwidget.GlanceAppWidgetReceiver
          import androidx.glance.appwidget.SizeMode
          import androidx.glance.appwidget.provideContent
          import androidx.glance.appwidget.updateAll
          import androidx.glance.background
          import androidx.glance.layout.Box
          import androidx.glance.layout.Column
          import androidx.glance.layout.Spacer
          import androidx.glance.layout.fillMaxSize
          import androidx.glance.layout.height
          import androidx.glance.layout.padding
          import androidx.glance.state.PreferencesGlanceStateDefinition
          import androidx.glance.text.FontWeight
          import androidx.glance.text.Text
          import androidx.glance.text.TextStyle
          import androidx.glance.unit.ColorProvider
          import java.text.NumberFormat
          import java.time.LocalDate
          import java.time.YearMonth
          import java.util.Locale

          class ShiftWidget : GlanceAppWidget() {
              override val stateDefinition = PreferencesGlanceStateDefinition
              override val sizeMode = SizeMode.Exact

              override suspend fun provideGlance(context: Context, id: GlanceId) {
                  provideContent { WidgetContent() }
              }

              @Composable
              private fun WidgetContent() {
                  val context = LocalContext.current
                  val prefs = AppPreferences(context)
                  val settings = prefs.loadSettings()
                  val overrides = prefs.loadOverrides()
                  val next = ShiftCalculator.nextWorkingShift(LocalDate.now(), settings, overrides)
                  val monthSummary = ShiftCalculator.monthSummary(YearMonth.now(), settings, overrides)

                  Box(
                      modifier = GlanceModifier
                          .fillMaxSize()
                          .background(ColorProvider(android.graphics.Color.rgb(54, 92, 245)))
                          .padding(16.dp)
                  ) {
                      Column {
                          Text(
                              text = "Мои смены",
                              style = TextStyle(
                                  color = ColorProvider(android.graphics.Color.WHITE),
                                  fontWeight = FontWeight.Bold
                              )
                          )
                          Spacer(GlanceModifier.height(8.dp))
                          Text(
                              text = next?.let {
                                  when (it.daysUntil) {
                                      0L -> "Сегодня: ${it.type.title}"
                                      1L -> "Завтра: ${it.type.title}"
                                      else -> "Через ${it.daysUntil} дн.: ${it.type.title}"
                                  }
                              } ?: "Смен не найдено",
                              style = TextStyle(color = ColorProvider(android.graphics.Color.WHITE))
                          )
                          Spacer(GlanceModifier.height(4.dp))
                          Text(
                              text = "За месяц: ${NumberFormat.getCurrencyInstance(Locale("ru", "RU")).format(monthSummary.totalPay)}",
                              style = TextStyle(color = ColorProvider(android.graphics.Color.WHITE))
                          )
                          Spacer(GlanceModifier.height(12.dp))
                          Button(text = "Открыть", onClick = actionStartActivity<MainActivity>())
                      }
                  }
              }
          }

          class ShiftWidgetReceiver : GlanceAppWidgetReceiver() {
              override val glanceAppWidget: GlanceAppWidget = ShiftWidget()

              companion object {
                  fun updateAll(context: Context) {
                      kotlinx.coroutines.runBlocking {
                          ShiftWidget().updateAll(context)
                      }
                  }
              }
          }
          KOT
          cat > MyShiftsPro/app/src/main/res/values/themes.xml <<'XML'
          <resources>
              <style name="Theme.MyShifts" parent="@android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          XML
          cat > MyShiftsPro/app/src/main/res/values-night/themes.xml <<'XML'
          <resources>
              <style name="Theme.MyShifts" parent="@android:style/Theme.Material.NoActionBar" />
          </resources>
          XML

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run tests
        run: gradle --no-daemon -p MyShiftsPro test --stacktrace

      - name: Build installable debug APK
        run: gradle --no-daemon -p MyShiftsPro assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          APK=$(find MyShiftsPro/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" MyShifts.apk
          sha256sum MyShifts.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyShifts-APK
          path: MyShifts.apk
          if-no-files-found: error

      - name: Record workflow run ID
        if: always()
        run: |
          mkdir -p build_status
          echo "$GITHUB_RUN_ID" > build_status/myshifts_last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_status/myshifts_last_run.txt
          git commit -m "Record MyShifts build run $GITHUB_RUN_ID" || exit 0
          git push
