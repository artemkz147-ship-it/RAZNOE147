name: Build MyShifts APK

on:
  push:
    branches: [main]
    paths:
      - 'myshifts_build/**'
      - '.github/workflows/myshifts-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        run: |
          cat myshifts_build/source.part00 myshifts_build/source.part01 myshifts_build/source.part02 myshifts_build/source.part03 > myshifts_build/source.b64
          base64 --decode myshifts_build/source.b64 > MyShiftsPro-source.zip
          unzip -tq MyShiftsPro-source.zip
          unzip -q -o MyShiftsPro-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run tests
        run: gradle --no-daemon -p MyShiftsPro test --stacktrace

      - name: Build installable debug APK
        run: gradle --no-daemon -p MyShiftsPro assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          APK=$(find MyShiftsPro/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" MyShifts.apk
          sha256sum MyShifts.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyShifts-APK
          path: MyShifts.apk
          if-no-files-found: error
