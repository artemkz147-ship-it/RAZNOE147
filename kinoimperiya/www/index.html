<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#151622">
<title>Киноимперия</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131e}
body{display:flex;align-items:center;justify-content:center;touch-action:none}
canvas{display:block;width:min(100vw,56.206vh);height:min(100vh,177.917vw);image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
</style></head>
<body><canvas id="game" width="480" height="854" aria-label="Киноимперия"></canvas>
<script>
"use strict";
const W=480,H=854,cv=document.getElementById("game"),c=cv.getContext("2d");
const COL={bg:"#141521",edge:"#738096",panel:"#232a3d",p2:"#303a52",gold:"#f5c77a",cream:"#fff2d9",muted:"#aeb8cd",green:"#78d8b0",red:"#ef8d9b",floor:"#66596c"};
const GEN=["Фантастика","Ужасы","Комедия","Боевик"], BUD=[8000,15000,28000], BUDNAME=["ИНДИ","СТАНДАРТ","БЛОКБАСТЕР"];
const TITLES=[
["Сигнал Ориона","Последняя орбита","Город на Марсе","Нулевой контакт","Сквозь время"],
["Тихий этаж","В полночь","Дом без окон","Тёмный лес","Запертые"],
["Соседи с Луны","Два билета","Шеф поневоле","Большой переполох","Папа в отпуске"],
["Город на грани","Последний выстрел","Точка удара","Двойной агент","Скорость 200"]];
const RECRUITS=[
{name:"Алиса",job:"Актриса",skill:71,salary:230,price:5800,color:"#dd8bb3"},
{name:"Илья",job:"Оператор",skill:62,salary:190,price:4600,color:"#75bacc"},
{name:"Диана",job:"Монтажёр",skill:78,salary:280,price:6500,color:"#c79cde"},
{name:"Рома",job:"Актёр",skill:59,salary:170,price:4200,color:"#aacc7b"},
{name:"Кира",job:"Продюсер",skill:82,salary:310,price:7500,color:"#eab77a"},
{name:"Тимур",job:"Звуковик",skill:65,salary:200,price:4800,color:"#92a0e0"}];
const initial=()=>({cash:50000,fans:80,rep:8,day:1,made:0,gross:0,trend:0,staff:[
{name:"Марк",job:"Режиссёр",skill:63,salary:180,color:"#f5c77a"},
{name:"Лиза",job:"Сценарист",skill:58,salary:150,color:"#8bc9ac"}],
film:null,history:[],debt:0,studio:1,pause:false});
let g;try{g=JSON.parse(localStorage.getItem("kinoimperiya_0.1"))||initial()}catch(e){g=initial()}
let screen="",genre=0,tier=0,msg="Снимите свой первый фильм!",btn=[],t0=0,stamp=0,last={};
function save(){try{localStorage.setItem("kinoimperiya_0.1",JSON.stringify(g))}catch(e){}}
function money(n){return (n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("ru-RU")}
function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(x|0,y|0,w|0,h|0)}
function line(x,y,w,h,col){rect(x,y,w,h,col)}
function text(x,y,s,size=15,color=COL.cream,bold=false,max=440){
 c.fillStyle=color;c.font=(bold?"bold ":"")+size+"px monospace";c.textBaseline="top";
 let str=String(s);if(c.measureText(str).width>max){while(str.length>2&&c.measureText(str+"…").width>max)str=str.slice(0,-1);str+="…"}c.fillText(str,x,y);
}
function box(x,y,w,h,fill=COL.panel,stroke=COL.edge){
 rect(x+3,y+3,w,h,"#090c16");rect(x,y,w,h,stroke);rect(x+3,y+3,w-6,h-6,fill);
 line(x,y,w,3,"#b4a17e");line(x,y,3,h,"#b4a17e");line(x+2,y+h-3,w-2,3,"#111827");
}
function button(x,y,w,h,label,id,on=false,active=true,size=15){
 let col=on?"#685233":active?"#334461":"#262a35";
 rect(x+2,y+3,w,h,"#101321");rect(x,y,w,h,active?(on?COL.gold:"#788ba8"):"#4a4f5e");
 rect(x+3,y+3,w-6,h-6,col);
 c.font="bold "+size+"px monospace";
 text(x+(w-c.measureText(label).width)/2,y+(h-size)/2-1,label,size,active?COL.cream:"#7e8494",true,w-10);
 btn.push({x,y,w,h,id,active});
}
function progress(x,y,w,fr){
 rect(x,y,w,18,"#121927");rect(x+2,y+2,(w-4)*Math.max(0,Math.min(1,fr)),14,COL.green);
}
function character(px,py,color,name,phase){
 // Pixel figure 12x20 scaled 2x.
 const x=Math.round(px+Math.sin(t0/800+phase)*7),y=Math.round(py+Math.cos(t0/650+phase)*3);
 rect(x-1,y+33,28,4,"#3a3448");
 rect(x+6,y,14,13,"#edba90");rect(x+4,y-2,18,5,"#392e40");
 rect(x+5,y+12,16,17,color);
 rect(x+1,y+14,4,12,"#dca983");rect(x+21,y+14,4,12,"#dca983");
 rect(x+6,y+29,6,8,"#343248");rect(x+15,y+29,6,8,"#343248");
 rect(x+9,y+6,2,2,"#283042");rect(x+17,y+6,2,2,"#283042");
 rect(x-13,y-20,52,16,"#181c2c");text(x-9,y-18,name,10,COL.cream,false,48);
}
function studio(){
 box(18,154,444,326,"#483f53",COL.gold);
 // Back wall and roofline
 rect(23,159,434,61,"#484e69");rect(23,214,434,6,"#24283d");
 for(let x=27;x<454;x+=29){rect(x,159,2,61,"#596178")}
 rect(25,220,430,250,COL.floor);
 for(let y=224;y<470;y+=27){for(let x=28;x<453;x+=34){rect(x+((y/27|0)%2)*11,y,32,25,((x+y)%3===0)?"#716478":"#63586b")}}
 // divider beams
 rect(238,220,6,246,"#333249");rect(26,333,423,6,"#403d50");
 // screenwriting station
 rect(46,250,123,12,"#a77c65");rect(53,261,11,39,"#594057");rect(144,261,11,39,"#594057");
 rect(64,229,61,26,"#262d43");rect(69,234,51,16,"#94a6bc");rect(89,250,12,5,"#3b415c");
 rect(144,229,10,21,"#a7d9ad");rect(144,222,23,8,"#658a77");
 // editing area
 rect(281,243,119,12,"#a77c65");rect(295,221,55,24,"#202939");
 rect(302,227,41,12,"#81a0c6");rect(359,221,24,20,"#283141");rect(362,224,18,14,"#e5bb80");
 rect(286,253,13,38,"#553e58");rect(385,253,12,38,"#553e58");
 // sound stage: red carpet, spot, camera
 rect(44,350,172,99,"#8e4e65");rect(50,356,159,87,"#a75d72");
 rect(68,369,108,13,"#b7897c");rect(90,382,66,35,"#7f4758");
 rect(180,378,16,30,"#1a2535");rect(173,372,24,12,"#202b3a");
 rect(183,409,4,24,"#d7c1a0");rect(171,430,27,5,"#a4a2b6");
 rect(72,350,7,34,"#b9b5a6");rect(51,343,45,18,"#efd18b");
 // props store
 for(let i=0;i<3;i++){rect(269+i*49,369,38,55,"#927461");rect(269+i*49,369,38,8,"#baa184")}
 rect(309,434,93,13,"#4f433e");rect(325,408,45,22,"#3a4b64");
 rect(329,411,37,7,"#86a8c0");rect(329,424,37,4,"#d5b77e");
 // Room tags
 for(const tag of [[34,190,"СЦЕНАРНАЯ"],[267,190,"МОНТАЖ"],[34,344,"ПАВИЛЬОН"],[286,344,"РЕКВИЗИТ"]]){
 rect(tag[0]-4,tag[1]-2,124,19,"#1a2030");text(tag[0],tag[1],tag[2],11,COL.cream,true,120);
 }
 const xy=[[80,280],[328,280],[133,400],[360,403],[74,400],[373,413],[285,270],[204,289]];
 g.staff.forEach((p,i)=>character(xy[i][0],xy[i][1],p.color||COL.gold,p.name,i*1.38));
 rect(23,158,433,23,"#182031");text(33,161,"КИНОСТУДИЯ «ИСКРА»",14,COL.cream,true);
 text(333,162,"1995 / "+g.day,12,COL.gold);
}
function backdrop(){
 rect(0,0,W,H,COL.bg);for(let y=0;y<H;y+=29)rect(0,y,W,1,"#1b2031");
 rect(0,0,W,7,COL.gold);
 text(20,20,"КИНОИМПЕРИЯ",29,COL.gold,true);text(357,30,"RETRO 16-BIT",10,COL.muted);
 text(21,60,"СТРОЙ СТУДИЮ. СНИМАЙ ЛЕГЕНДЫ.",11,COL.muted);
 box(18,79,216,65);box(244,79,218,65);
 text(30,90,"КАССА СТУДИИ",12,COL.muted);text(30,111,money(g.cash),23,g.cash>=0?COL.green:COL.red,true,196);
 text(255,90,"ПОКЛОННИКИ",11,COL.muted);text(255,110,g.fans,21,COL.cream,true);
 text(353,90,"РЕПУТАЦИЯ",10,COL.muted);text(352,114,g.rep+"/100",17,COL.gold,true);
 studio();
 box(18,490,444,145);
 if(g.film){
   let f=g.film;
   text(31,502,"СЪЁМКИ: "+f.name.toUpperCase(),17,COL.gold,true,410);
   text(32,531,"ЖАНР: "+GEN[f.genre],12,COL.muted);text(332,531,f.progress+"/"+f.days+" ДН.",12,COL.cream);
   progress(31,555,416,f.progress/f.days);
   text(31,587,"БЮДЖЕТ: "+money(f.budget),14,COL.cream);
   text(31,611,"ДО ПРЕМЬЕРЫ: "+(f.days-f.progress)+" ДН.",12,COL.green);
 } else {
   text(31,501,"ПАВИЛЬОН СВОБОДЕН",19,COL.gold,true);
   text(31,536,"Сейчас фильмов в производстве нет.",14,COL.cream);
   text(31,565,"Выбери жанр и начни снимать.",12,COL.muted);
   text(31,591,"ТРЕНД СЕЗОНА:",12,COL.muted);text(178,588,GEN[g.trend],15,COL.green,true);
   text(31,615,"СОТРУДНИКИ: "+g.staff.length+" / 8",12,COL.muted);
 }
 text(23,647,msg,12,COL.muted,false,434);
 button(18,668,273,61,"+ СОЗДАТЬ ФИЛЬМ","new",false,!g.film,17);
 button(301,668,161,61,"НАНЯТЬ","hire",false,true,16);
 button(18,742,138,55,"АРХИВ","archive",false,true);
 button(168,742,138,55,"+ 3 ДНЯ","skip",false,!g.pause);
 button(318,742,144,55,g.pause?"ИГРАТЬ":"ПАУЗА","pause");
 text(18,817,"АВТОСОХРАНЕНИЕ • ОФЛАЙН",11,COL.muted);
 button(363,807,99,34,"ПОМОЩЬ","help",false,true,11);
}
function dim(){rect(0,0,W,H,"rgba(4,7,14,.87)");btn=[]}
function heading(y,s){text(33,y,s,23,COL.gold,true,406);button(404,y-5,40,35,"X","close")}
function movieModal(){
 box(17,105,446,645);heading(128,"НОВЫЙ ФИЛЬМ");
 text(34,180,"1. ВЫБЕРИТЕ ЖАНР",14,COL.cream,true);
 GEN.forEach((v,i)=>button(33+(i%2)*212,198+Math.floor(i/2)*75,200,62,v,"genre:"+i,genre===i,true,15));
 text(33,365,"2. ВЫБЕРИТЕ БЮДЖЕТ",14,COL.cream,true);
 BUD.forEach((v,i)=>{let x=33+i*142;button(x,391,132,87,BUDNAME[i],"budget:"+i,tier===i,true,12);text(x+11,460,money(v),12,COL.gold)});
 text(35,502,"СРОК СЪЁМОК: "+[9,13,18][tier]+"–"+([9,13,18][tier]+3)+" ДНЕЙ",13,COL.muted);
 text(35,531,"ТРЕНД: "+GEN[g.trend],13,COL.green);
 text(35,561,"Бюджет списывается сразу.",12,COL.muted);
 button(32,603,416,67,"НАЧАТЬ СЪЁМКИ","start",true,g.cash>=BUD[tier],18);
 text(36,703,"ПОСЛЕ СТАРТА: "+money(g.cash-BUD[tier]),14,g.cash>=BUD[tier]?COL.green:COL.red,true);
}
function hireModal(){
 box(17,95,446,669);heading(115,"КАСТИНГ И КОМАНДА");
 const wage=90+g.staff.reduce((s,p)=>s+p.salary,0);
 text(34,159,"СОТРУДНИКИ: "+g.staff.length+"/8    РАСХОД: "+money(wage)+"/день",12,COL.muted);
 const available=RECRUITS.filter(p=>!g.staff.some(k=>k.name===p.name)).slice(0,4);
 if(!available.length)text(38,275,"Все специалисты работают у вас!",16,COL.green);
 available.forEach((p,i)=>{
 let y=182+i*117;
 box(31,y,420,107,COL.p2,"#596c86");
 character(45,y+43,p.color,"",i);rect(36,y+21,49,16,COL.p2);
 text(94,y+15,p.name+" — "+p.job,15,COL.cream,true,335);
 text(94,y+44,"НАВЫК: "+p.skill+"/100",12,COL.green);
 text(94,y+72,"Зарплата: "+money(p.salary)+"/день",11,COL.muted);
 button(315,y+64,126,36,money(p.price),"hire:"+p.name,false,g.cash>=p.price&&g.staff.length<8,13);
 });
 text(35,710,"Специалисты повышают качество фильмов.",12,COL.muted);
}
function archiveModal(){
 box(17,100,446,663);heading(122,"АРХИВ СТУДИИ");
 text(34,173,"ВЫПУЩЕНО ФИЛЬМОВ",11,COL.muted);text(35,194,g.made,26,COL.cream,true);
 text(216,173,"СУММАРНЫЕ СБОРЫ",11,COL.muted);text(212,197,money(g.gross),21,COL.green,true,230);
 text(34,254,"ПОСЛЕДНИЕ ПРЕМЬЕРЫ",15,COL.gold,true);
 if(!g.history.length)text(38,295,"Пока нет фильмов. Пора снимать!",13,COL.muted);
 g.history.slice(0,4).forEach((f,i)=>{
   let y=279+i*70;box(32,y,415,62,COL.p2);
   text(44,y+10,f.name,14,COL.cream,true,289);text(369,y+10,f.quality+"/100",12,COL.gold);
   text(44,y+36,"СБОРЫ: "+money(f.gross),12,COL.green);
 });
 text(35,583,"КОМАНДА: "+g.staff.length+"/8",14,COL.cream);
 text(35,610,"ПАВИЛЬОН: УРОВЕНЬ "+g.studio,14,COL.cream);
 if(g.studio<3)button(34,636,412,47,"УЛУЧШИТЬ СТУДИЮ — "+money(g.studio*12000),"upgrade",false,g.cash>=g.studio*12000,11);
 else text(36,644,"Студия прокачана до максимума!",12,COL.green);
 if(g.cash<16000 && !g.debt)button(34,692,412,40,"КРЕДИТ +$11 000 / ДОЛГ $14 000","loan",false,true,12);
 if(g.debt)text(35,712,"ДОЛГ: "+money(g.debt),12,COL.red);
}
function resultModal(){
 box(17,154,446,545);text(33,183,"МИРОВАЯ ПРЕМЬЕРА!",23,COL.gold,true);
 text(35,222,last.name,19,COL.cream,true,410);
 rect(34,257,410,3,COL.gold);
 text(35,291,"ОЦЕНКА КРИТИКОВ",14,COL.muted);
 text(35,322,last.quality+"/100",48,last.quality>=65?COL.green:COL.gold,true);
 progress(34,392,412,last.quality/100);
 text(35,437,"БЮДЖЕТ",12,COL.muted);text(282,437,"СБОРЫ",12,COL.muted);
 text(35,461,money(last.budget),18,COL.cream,true);text(282,461,money(last.gross),18,COL.green,true);
 text(35,510,"ИТОГ ПРОКАТА: "+money(last.gross-last.budget),14,last.gross>=last.budget?COL.green:COL.red,true);
 text(35,546,"НОВЫЕ ПОКЛОННИКИ: "+last.fans,13,COL.gold);
 button(33,603,415,64,"ПРОДОЛЖИТЬ","close",true,true,18);
}
function helpModal(){
 box(17,164,446,523);heading(183,"КАК ИГРАТЬ");
 [
 "1. Нажмите «СОЗДАТЬ ФИЛЬМ».",
 "2. Выберите жанр и бюджет.",
 "3. Дождитесь окончания съёмок.",
 "4. Следите за зарплатами команды.",
 "5. Нанимайте специалистов.",
 "6. Развивайте киностудию."
 ].forEach((s,i)=>text(37,250+i*44,s,14,COL.cream));
 text(36,548,"Прогресс сохраняется на устройстве.",12,COL.green);
 button(33,604,415,56,"ПОНЯТНО","close",true,true);
}
function finished(){
 const f=g.film, avg=g.staff.reduce((a,p)=>a+p.skill,0)/g.staff.length;
 const quality=Math.max(10,Math.min(99,Math.round(20+avg*.53+f.tier*6+g.studio*4+(f.genre===g.trend?9:0)+(Math.random()*23-12))));
 const gross=Math.max(800,Math.round(f.budget*(.28+quality/47+g.fans/2500)*(.8+Math.random()*.42)));
 const fans=quality<40?-Math.min(35,Math.floor(g.fans/8)):Math.max(5,Math.round((quality-24)*(f.tier+1)*1.65));
 g.cash+=gross;g.gross+=gross;g.fans=Math.max(0,g.fans+fans);g.rep=Math.max(0,Math.min(100,g.rep+(quality>=80?4:quality>=65?2:quality>=50?1:-2)));
 if(g.debt){let pay=Math.min(Math.floor(gross/2),g.debt);g.cash-=pay;g.debt-=pay;}
 g.made++;last={...f,quality,gross,fans};g.history.unshift(last);g.history=g.history.slice(0,20);g.film=null;screen="result";msg="Премьера состоялась!";save();
}
function advance(n){
 for(let i=0;i<n;i++){
 g.day++;g.cash-=90+g.staff.reduce((a,p)=>a+p.salary,0);
 if(g.day%18===0){g.trend=(g.trend+1)%4;msg="НОВЫЙ ТРЕНД: "+GEN[g.trend];}
 if(g.film){g.film.progress++;if(g.film.progress>=g.film.days){finished();break;}}
 }
 save();
}
function act(id){
 if(id==="close"){screen="";save();}
 if(id==="new"&&!g.film){screen="movie";genre=0;tier=0;}
 if(id==="hire")screen="hire";
 if(id==="archive")screen="archive";
 if(id==="help")screen="help";
 if(id==="pause"){g.pause=!g.pause;msg=g.pause?"Игра остановлена.":"Студия работает.";save();}
 if(id==="skip"&&!g.pause)advance(3);
 if(id.startsWith("genre:"))genre=Number(id.split(":")[1]);
 if(id.startsWith("budget:"))tier=Number(id.split(":")[1]);
 if(id==="start" && g.cash>=BUD[tier]&&!g.film){
   const name=TITLES[genre][g.made%5];
   g.film={name,genre,tier,budget:BUD[tier],days:[9,13,18][tier]+Math.floor(Math.random()*4),progress:0};
   g.cash-=BUD[tier];g.pause=false;screen="";msg="КАМЕРА, МОТОР! «"+name+"»";save();
 }
 if(id.startsWith("hire:")){
   const p=RECRUITS.find(x=>x.name===id.split(":")[1]);
   if(p&&g.cash>=p.price&&!g.staff.some(x=>x.name===p.name)&&g.staff.length<8){
     g.cash-=p.price;g.staff.push({...p});msg=p.name+" теперь в команде!";save();
   }
 }
 if(id==="upgrade"&&g.studio<3&&g.cash>=g.studio*12000){
   g.cash-=g.studio*12000;g.studio++;msg="Павильон улучшен!";save();
 }
 if(id==="loan"&&!g.debt){g.cash+=11000;g.debt=14000;msg="Получен кредит $11 000";save();}
}
function draw(){
 btn=[];backdrop();
 if(screen){dim();if(screen==="movie")movieModal();else if(screen==="hire")hireModal();
 else if(screen==="archive")archiveModal();else if(screen==="result")resultModal();else if(screen==="help")helpModal();}
}
function frame(ts){
 t0=ts;
 if(!stamp)stamp=ts;
 if(!g.pause&&g.film && screen!=="result" && ts-stamp>=1300){advance(1);stamp=ts;}
 draw();requestAnimationFrame(frame);
}
cv.addEventListener("pointerdown",e=>{
 e.preventDefault();let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 for(let i=btn.length-1;i>=0;i--){let b=btn[i];if(b.active&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){act(b.id);break;}}
},{passive:false});
window.addEventListener("keydown",e=>{if(e.key==="Escape"||e.key==="Backspace"){screen="";}});
requestAnimationFrame(frame);
</script></body></html>
