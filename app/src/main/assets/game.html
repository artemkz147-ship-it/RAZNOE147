<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,Roboto,system-ui,sans-serif}
#game,.ejs_parent,.ejs_game,.ejs_canvas_parent{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;background:#000!important;outline:0!important;overflow:hidden!important}
.ejs_canvas,#game canvas{position:fixed!important;left:0!important;top:0!important;margin:0!important;max-width:none!important;max-height:none!important;transform:none!important;background:#000!important}
body:not(.stretch) .ejs_canvas,body:not(.stretch) #game canvas{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center center!important}
body.stretch .ejs_canvas,body.stretch #game canvas{width:100vw!important;height:100vh!important;object-fit:fill!important;object-position:center center!important;aspect-ratio:auto!important}
body.touch-off .ejs_virtualGamepad_parent,body.touch-minimal .ejs_virtualGamepad_parent{display:none!important}
.ejs_menu_bar,.ejs_context_menu,.ejs_settings_parent,.ejs_setting_menu,.ejs_virtualGamepad_open,.b_speed_fast,.b_speed_slow,.b_speed_rewind,.ejs_message,.ejs_popup_container{display:none!important;visibility:hidden!important;pointer-events:none!important}
body.dir-dpad .b_retro_stick{display:none!important}body.dir-stick .b_retro_dpad{display:none!important}body.dir-both .b_retro_dpad,body.dir-both .b_retro_stick{display:block}
body.layout-edit .ejs_virtualGamepad_parent{display:block!important;opacity:1!important;z-index:999990!important}
body.layout-edit .ejs_virtualGamepad_parent [class*="b_"]{outline:2px dashed rgba(255,228,92,.95)!important;touch-action:none!important;cursor:move!important}
#layoutEditor{position:fixed;z-index:1000000;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid #414958;border-radius:12px;background:rgba(12,15,21,.94);color:#fff;backdrop-filter:blur(10px)}
#layoutEditor span{font:800 10px system-ui,sans-serif;color:#dce2ea}#layoutEditor button{height:32px;border:1px solid #444d5c;border-radius:8px;background:#222833;color:#fff;padding:0 10px;font:850 10px system-ui,sans-serif}#layoutEditor .done{background:#ffe45c;color:#111;border-color:#ffe45c}
</style>
</head>
<body><div id="game" tabindex="0"></div>
<script>
(()=>{'use strict';
const PARENT_ORIGIN=location.origin;
let started=false,startConfirmed=false,watchdog=0,currentCore='',currentSettings={touchMode:'full',stretch:false},currentProfile=null;
let stickBridgeRAF=0,stickState=[false,false,false,false],layoutEditing=false,layoutHandlers=[],stretchTimer=0;
const send=(type,extra={})=>{try{parent.postMessage({type,...extra},PARENT_ORIGIN)}catch(_){}};
const safeMessage=v=>v instanceof Error?(v.message||v.name):(v&&typeof v==='object'&&v.message?String(v.message):String(v||'Неизвестная ошибка'));
const cleanGameName=name=>{const v=String(name||'game'),i=v.lastIndexOf('.');return(i>0?v.slice(0,i):v).replace(/[^\p{L}\p{N} _().\-]+/gu,'').trim()||'game'};
const expectedExtensions=core=>core==='nes'?['nes','unif','unf','zip','7z','rar']:core==='segaMD'?['md','smd','gen','bin','mdx','68k','sgd','sms','gg','sg','bms','zip','7z','rar']:['chd','pbp','bin','iso','img','exe','zip','7z','rar'];
function verifyConfig(c){if(!c||typeof c!=='object')throw Error('Не получены параметры запуска.');if(!['nes','segaMD','psx'].includes(c.core))throw Error('Эта система не поддерживается этой сборкой.');if(typeof c.romUrl!=='string'||!c.romUrl.startsWith('blob:'))throw Error('Не удалось подготовить локальный ROM.');if(!c.romName||Number(c.romSize)<=0)throw Error('Выбранный файл игры пустой или недоступен.');const ext=String(c.romName).split('.').pop().toLowerCase();if(!expectedExtensions(c.core).includes(ext))throw Error(`Формат .${ext||'?'} не подходит для выбранной приставки.`)}
function virtualGamepad(core){const dpad={type:'dpad',id:'retro_dpad',location:'left',left:'50%',top:'50%',joystickInput:false,inputValues:[4,5,6,7]};const digitalStick={type:'zone',id:'retro_stick',location:'left',left:'50%',top:'50%',color:'#e8edf5',joystickInput:false,inputValues:[4,5,6,7]};if(core==='nes')return[{type:'button',text:'B',id:'b',location:'right',right:75,top:70,bold:true,input_value:0},{type:'button',text:'A',id:'a',location:'right',right:5,top:70,bold:true,input_value:8},dpad,digitalStick,{type:'button',text:'Start',id:'start',location:'center',left:60,fontSize:14,block:true,input_value:3},{type:'button',text:'Select',id:'select',location:'center',left:-5,fontSize:14,block:true,input_value:2}];if(core==='segaMD')return[{type:'button',text:'A',id:'a',location:'right',right:145,top:70,bold:true,input_value:1},{type:'button',text:'B',id:'b',location:'right',right:75,top:70,bold:true,input_value:0},{type:'button',text:'C',id:'c',location:'right',right:5,top:70,bold:true,input_value:8},{type:'button',text:'X',id:'x',location:'right',right:145,top:0,bold:true,input_value:10},{type:'button',text:'Y',id:'y',location:'right',right:75,top:0,bold:true,input_value:9},{type:'button',text:'Z',id:'z',location:'right',right:5,top:0,bold:true,input_value:11},dpad,digitalStick,{type:'button',text:'Mode',id:'mode',location:'center',left:-5,fontSize:14,block:true,input_value:2},{type:'button',text:'Start',id:'start',location:'center',left:60,fontSize:14,block:true,input_value:3}];return[{type:'button',text:'□',id:'square',location:'right',right:145,top:50,bold:true,input_value:1},{type:'button',text:'×',id:'cross',location:'right',right:75,top:90,bold:true,input_value:0},{type:'button',text:'○',id:'circle',location:'right',right:5,top:50,bold:true,input_value:8},{type:'button',text:'△',id:'triangle',location:'right',right:75,top:10,bold:true,input_value:9},{type:'dpad',id:'retro_dpad',location:'left',left:'50%',top:'0%',joystickInput:false,inputValues:[4,5,6,7]},{type:'zone',id:'retro_stick',location:'left',left:'50%',top:'100%',color:'#e8edf5',joystickInput:true,inputValues:[16,17,18,19]},{type:'button',text:'L1',id:'l1',location:'top',left:10,top:-38,bold:true,block:true,input_value:10},{type:'button',text:'R1',id:'r1',location:'top',right:10,top:-38,bold:true,block:true,input_value:11},{type:'button',text:'L2',id:'l2',location:'top',left:75,top:-38,bold:true,block:true,input_value:12},{type:'button',text:'R2',id:'r2',location:'top',right:75,top:-38,bold:true,block:true,input_value:13},{type:'button',text:'Start',id:'start',location:'center',left:60,fontSize:14,block:true,input_value:3},{type:'button',text:'Select',id:'select',location:'center',left:-5,fontSize:14,block:true,input_value:2}]}
function directionMode(s=currentSettings){return currentCore==='psx'?(s.virtualPs||'both'):(s.virtual8||'dpad')}
function applyDirection(s=currentSettings){document.body.classList.remove('dir-dpad','dir-stick','dir-both');const m=directionMode(s);document.body.classList.add(`dir-${['dpad','stick','both'].includes(m)?m:'dpad'}`)}
function applyTouchMode(){const m=['full','minimal','off'].includes(currentSettings.touchMode)?currentSettings.touchMode:'full';document.body.classList.remove('touch-full','touch-minimal','touch-off');document.body.classList.add(`touch-${m}`);try{window.EJS_emulator?.toggleVirtualGamepad?.(m==='full'||layoutEditing)}catch(_){}}
function enforceStretch(){const on=!!currentSettings.stretch;document.body.classList.toggle('stretch',on);const targets=new Set([...document.querySelectorAll('.ejs_canvas,#game canvas')]);if(window.EJS_emulator?.canvas)targets.add(window.EJS_emulator.canvas);for(const c of targets){if(!c)continue;c.style.setProperty('position','fixed','important');c.style.setProperty('left','0','important');c.style.setProperty('top','0','important');c.style.setProperty('margin','0','important');c.style.setProperty('max-width','none','important');c.style.setProperty('max-height','none','important');c.style.setProperty('transform','none','important');c.style.setProperty('width',on?'100vw':'100%','important');c.style.setProperty('height',on?'100vh':'100%','important');c.style.setProperty('object-fit',on?'fill':'contain','important');c.style.setProperty('object-position','center center','important');if(on)c.style.setProperty('aspect-ratio','auto','important');else c.style.removeProperty('aspect-ratio')}document.querySelectorAll('#game,.ejs_parent,.ejs_game,.ejs_canvas_parent').forEach(p=>{p.style.setProperty('width','100vw','important');p.style.setProperty('height','100vh','important');p.style.setProperty('max-width','none','important');p.style.setProperty('max-height','none','important')})}
function refreshStretchWatch(){clearInterval(stretchTimer);enforceStretch();if(currentSettings.stretch)stretchTimer=setInterval(enforceStretch,100)}
function applyControlProfile(profile){if(!profile||typeof profile!=='object')return;currentProfile=profile;const emu=window.EJS_emulator;if(!emu)return;const src=profile[0]||profile['0'];if(!src||typeof src!=='object')return;emu.controls=emu.controls||{};emu.controls[0]=emu.controls[0]||{};emu.defaultControllers=emu.defaultControllers||{};emu.defaultControllers[0]=emu.defaultControllers[0]||{};for(const [id,v] of Object.entries(src)){if(!v||typeof v!=='object')continue;emu.controls[0][id]={...(emu.controls[0][id]||{}),...v};emu.defaultControllers[0][id]={...(emu.defaultControllers[0][id]||{}),...v}}try{emu.checkGamepadInputs?.()}catch(_){}}
function applySettings(s={}){currentSettings={...currentSettings,...s};applyTouchMode();applyDirection(currentSettings);refreshStretchWatch();const emu=window.EJS_emulator;if(!emu)return;try{const v=Math.max(0,Math.min(1,Number(currentSettings.volume??80)/100));emu.volume=v;emu.setVolume?.(v)}catch(_){}try{emu.changeSettingOption?.('save-state-slot',String(Math.max(1,Math.min(9,Number(currentSettings.quickSlot||1)))))}catch(_){}setTimeout(()=>{enforceStretch();applySavedLayout()},40)}
function quickSave(slot){const emu=window.EJS_emulator;try{const s=String(Math.max(1,Math.min(9,Number(slot||1))));emu?.changeSettingOption?.('save-state-slot',s);const ok=!!emu?.gameManager?.quickSave?.(s);send('retro-quick-result',{ok,message:ok?`Сохранено в слот ${s}`:'Не удалось быстро сохранить.'})}catch(e){send('retro-quick-result',{ok:false,message:safeMessage(e)})}}
function quickLoad(slot){const emu=window.EJS_emulator;try{const s=String(Math.max(1,Math.min(9,Number(slot||1))));emu?.changeSettingOption?.('save-state-slot',s);emu?.gameManager?.quickLoad?.(s);send('retro-quick-result',{ok:true,message:`Загружен слот ${s}`})}catch(e){send('retro-quick-result',{ok:false,message:safeMessage(e)})}}
function manualInput(index,value){try{window.EJS_emulator?.gameManager?.simulateInput?.(0,Number(index),value?1:0)}catch(_){}}
function pauseGame(){try{window.EJS_emulator?.pause?.();send('retro-pause-state',{paused:true})}catch(_){}}
function resumeGame(){if(layoutEditing)return;try{window.EJS_emulator?.play?.();send('retro-pause-state',{paused:false})}catch(_){}}
function startDigitalStickBridge(){cancelAnimationFrame(stickBridgeRAF);stickState=[false,false,false,false];if(!['nes','segaMD'].includes(currentCore))return;const loop=()=>{const gm=window.EJS_emulator?.gameManager;if(gm&&!layoutEditing){let gp=null;try{gp=[...(navigator.getGamepads?.()||[])].filter(Boolean)[0]}catch(_){}const x=gp?.axes?.[0]||0,y=gp?.axes?.[1]||0;const next=[y<-.45,y>.45,x<-.45,x>.45];for(let i=0;i<4;i++){if(next[i]!==stickState[i]){try{gm.simulateInput(0,4+i,next[i]?1:0)}catch(_){}stickState[i]=next[i]}}}stickBridgeRAF=requestAnimationFrame(loop)};stickBridgeRAF=requestAnimationFrame(loop)}
function layoutKey(){return`retro-vpad-layout-${currentCore}`}
function getLayout(){try{return JSON.parse(localStorage.getItem(layoutKey())||'{}')||{}}catch(_){return{}}}
function controlId(el){return[...el.classList].find(x=>x.startsWith('b_'))||''}
function movableControls(){const set=new Set;document.querySelectorAll('.ejs_virtualGamepad_parent [class*="b_"]').forEach(el=>{if(controlId(el))set.add(el)});return[...set]}
function applySavedLayout(){const data=getLayout();movableControls().forEach(el=>{const id=controlId(el),p=data[id];if(!p)return;el.style.setProperty('position','fixed','important');el.style.setProperty('left',`${Math.max(2,Math.min(98,p.x))}%`,'important');el.style.setProperty('top',`${Math.max(2,Math.min(98,p.y))}%`,'important');el.style.setProperty('right','auto','important');el.style.setProperty('bottom','auto','important');el.style.setProperty('transform','translate(-50%,-50%)','important');el.style.setProperty('z-index','999995','important')})}
function saveOnePosition(el,x,y){const data=getLayout(),id=controlId(el);if(!id)return;data[id]={x:Math.max(2,Math.min(98,x/window.innerWidth*100)),y:Math.max(2,Math.min(98,y/window.innerHeight*100))};try{localStorage.setItem(layoutKey(),JSON.stringify(data))}catch(_){}}
function clearLayoutStyles(){movableControls().forEach(el=>['position','left','top','right','bottom','transform','z-index'].forEach(p=>el.style.removeProperty(p)))}
function exitLayoutEditor(reset=false){if(!layoutEditing)return;layoutEditing=false;document.body.classList.remove('layout-edit');layoutHandlers.forEach(([el,type,fn,opt])=>el.removeEventListener(type,fn,opt));layoutHandlers=[];document.querySelector('#layoutEditor')?.remove();if(reset){try{localStorage.removeItem(layoutKey())}catch(_){}clearLayoutStyles()}else applySavedLayout();applyTouchMode();send('retro-layout-closed',{reset})}
function openLayoutEditor(){if(layoutEditing)return;layoutEditing=true;pauseGame();document.body.classList.add('layout-edit');try{window.EJS_emulator?.toggleVirtualGamepad?.(true)}catch(_){}setTimeout(()=>{applySavedLayout();document.body.insertAdjacentHTML('beforeend','<div id="layoutEditor"><span>Перетащите кнопки куда удобно</span><button id="layoutReset">Сбросить</button><button id="layoutDone" class="done">Готово</button></div>');document.querySelector('#layoutDone')?.addEventListener('click',()=>exitLayoutEditor(false));document.querySelector('#layoutReset')?.addEventListener('click',()=>exitLayoutEditor(true));movableControls().forEach(el=>{let dx=0,dy=0,drag=false;const down=e=>{e.preventDefault();e.stopPropagation();const r=el.getBoundingClientRect();dx=e.clientX-(r.left+r.width/2);dy=e.clientY-(r.top+r.height/2);drag=true;try{el.setPointerCapture?.(e.pointerId)}catch(_){}};const move=e=>{if(!drag)return;e.preventDefault();e.stopPropagation();const x=Math.max(10,Math.min(innerWidth-10,e.clientX-dx)),y=Math.max(10,Math.min(innerHeight-10,e.clientY-dy));el.style.setProperty('position','fixed','important');el.style.setProperty('left',`${x}px`,'important');el.style.setProperty('top',`${y}px`,'important');el.style.setProperty('right','auto','important');el.style.setProperty('bottom','auto','important');el.style.setProperty('transform','translate(-50%,-50%)','important')};const up=e=>{if(!drag)return;drag=false;const r=el.getBoundingClientRect();saveOnePosition(el,r.left+r.width/2,r.top+r.height/2);applySavedLayout()};el.addEventListener('pointerdown',down,true);el.addEventListener('pointermove',move,true);el.addEventListener('pointerup',up,true);el.addEventListener('pointercancel',up,true);layoutHandlers.push([el,'pointerdown',down,true],[el,'pointermove',move,true],[el,'pointerup',up,true],[el,'pointercancel',up,true])})},80)}
function start(config){if(started)return;started=true;try{verifyConfig(config);currentCore=config.core;currentSettings={touchMode:'full',stretch:false,...(config.settings||{})};currentProfile=config.controlProfile||null;window.EJS_player='#game';window.EJS_core=config.core;window.EJS_controlScheme=config.core;window.EJS_gameName=cleanGameName(config.romName);window.EJS_gameUrl=config.romUrl;window.EJS_biosUrl=config.biosUrl||'';window.EJS_pathtodata='data/';window.EJS_language='ru-RU';window.EJS_disableAutoLang=true;window.EJS_volume=Math.max(0,Math.min(1,Number(currentSettings.volume??80)/100));window.EJS_startOnLoaded=true;window.EJS_fullscreenOnLoaded=false;window.EJS_askBeforeExit=false;window.EJS_browserMode='mobile';window.EJS_noAutoFocus=false;window.EJS_VirtualGamepadSettings=virtualGamepad(config.core);if(currentProfile&&typeof currentProfile==='object')window.EJS_defaultControls=currentProfile;window.EJS_defaultOptions={'save-state-location':'browser','save-state-slot':String(Math.max(1,Math.min(9,Number(currentSettings.quickSlot||1)))),'menu-bar-button':'hidden','rewindEnabled':'disabled','fastForward':'disabled','slowMotion':'disabled'};window.EJS_Buttons={restart:false,pause:false,play:false,mute:false,settings:false,enterFullscreen:false,exitFullscreen:false,saveState:false,loadState:false,screenRecord:false,gamepad:false,cheat:false,volume:false,saveSavFiles:false,loadSavFiles:false,quickSave:false,quickLoad:false,screenshot:false,cacheManager:false,exitEmulation:false};window.EJS_ready=()=>{applySettings(currentSettings);if(currentProfile)applyControlProfile(currentProfile);send('retro-emulator-ready')};window.EJS_onGameStart=()=>{clearTimeout(watchdog);watchdog=setTimeout(()=>{const emu=window.EJS_emulator,fileName=emu?.fileName;if(!emu?.started||!fileName){send('retro-error',{message:'Ядро запустилось, но не смогло открыть выбранный ROM.'});return}startConfirmed=true;applySettings(currentSettings);if(currentProfile)applyControlProfile(currentProfile);startDigitalStickBridge();try{document.querySelector('#game')?.focus?.()}catch(_){}send('retro-game-start',{fileName:String(fileName)})},900)};window.EJS_onExit=()=>{if(!startConfirmed)send('retro-error',{message:'Эмулятор завершил запуск до открытия игры.'});else send('retro-exit')};const loader=document.createElement('script');loader.src='data/loader.js';loader.async=false;loader.onerror=()=>send('retro-error',{message:'Не удалось загрузить встроенный модуль эмулятора.'});document.body.appendChild(loader);watchdog=setTimeout(()=>{if(!startConfirmed)send('retro-error',{message:'Эмулятор не подтвердил запуск игры.'})},37000);new MutationObserver(()=>{if(started){enforceStretch();applySavedLayout()}}).observe(document.querySelector('#game'),{childList:true,subtree:true})}catch(e){send('retro-error',{message:safeMessage(e)})}}
window.addEventListener('resize',()=>setTimeout(()=>{enforceStretch();applySavedLayout()},30));
window.addEventListener('message',e=>{if(e.origin!==PARENT_ORIGIN)return;const d=e.data||{};if(d.type==='retro-start')start(d);else if(d.type==='retro-stop'){clearTimeout(watchdog);clearInterval(stretchTimer);cancelAnimationFrame(stickBridgeRAF);try{window.EJS_emulator?.gameManager?.exit?.()}catch(_){}}else if(d.type==='retro-pause')pauseGame();else if(d.type==='retro-resume')resumeGame();else if(d.type==='retro-apply-settings')applySettings(d.settings||{});else if(d.type==='retro-set-controls')applyControlProfile(d.profile);else if(d.type==='retro-quick-save')quickSave(d.slot);else if(d.type==='retro-quick-load')quickLoad(d.slot);else if(d.type==='retro-input')manualInput(d.index,d.value);else if(d.type==='retro-edit-layout')openLayoutEditor()});
window.addEventListener('error',e=>{if(started&&!startConfirmed)send('retro-error',{message:e.message||'Ошибка запуска игры.'})});window.addEventListener('unhandledrejection',e=>{if(started&&!startConfirmed)send('retro-error',{message:safeMessage(e.reason)})});send('retro-ready');
})();
</script></body></html>
