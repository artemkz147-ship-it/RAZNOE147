plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.retro.threeinone'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.retro.threeinone'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.0-rebuild'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
