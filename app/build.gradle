plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.retro.threeinone'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.retro.threeinone'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '2.5.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
}
